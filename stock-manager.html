<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --border2: #3a3a3a;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #c8f56a;
    --accent-dim: rgba(200,245,106,0.08);
    --accent-dim2: rgba(200,245,106,0.15);
    --red: #ff6b6b;
    --red-dim: rgba(255,107,107,0.1);
    --amber: #ffc14a;
    --green: #6adf99;
    --mono: 'DM Sans', sans-serif;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  /* STICKY TOP */
  #stickyTop { position: sticky; top: 0; z-index: 100; }

  /* HEADER */
  .header {
    background: rgba(15,15,15,0.97); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; align-items: center; gap: 12px; height: 56px;
  }
  .header-title { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); }
  .header-spacer { flex: 1; }
  .sync-status { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  /* NAV TABS */
  .nav-tabs {
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; gap: 0;
  }
  .nav-tab {
    padding: 11px 18px; font-size: 12px; font-weight: 500; color: var(--text3);
    border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: var(--sans); white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text2); }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 5px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-family: var(--sans); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: var(--text3); background: #2a2a2a; }
  .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  .btn-primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: #d6ff7a; border-color: #d6ff7a; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-danger { color: var(--red); border-color: rgba(255,107,107,0.3); }
  .btn-danger:hover { background: var(--red-dim); border-color: var(--red); }
  .btn-icon { padding: 5px; border-radius: 4px; }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* TOOLBAR */
  .toolbar { padding: 10px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--bg); }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap svg { position: absolute; left: 9px; color: var(--text3); width: 14px; height: 14px; pointer-events: none; }
  .search { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--sans); font-size: 13px; padding: 7px 10px 7px 30px; outline: none; }
  .search:focus { border-color: var(--border2); }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .chip:hover { border-color: var(--border2); color: var(--text); }
  .chip.active { background: var(--accent-dim2); border-color: rgba(200,245,106,0.4); color: var(--accent); }

  /* SUMMARY BAR */
  .summary-bar { padding: 8px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 28px; align-items: center; }
  .stat { display: flex; flex-direction: column; }
  .stat-val { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-top: 1px; }

  /* PRODUCTS TABLE */
  .category-section { border-bottom: 1px solid var(--border); }
  .category-header { display: flex; align-items: center; gap: 10px; padding: 10px 24px; cursor: pointer; background: rgba(255,255,255,0.02); user-select: none; }
  .category-header:hover { background: rgba(255,255,255,0.04); }
  .category-name { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); }
  .category-count { font-size: 11px; color: var(--text3); }
  .category-toggle { color: var(--text3); transition: transform 0.2s; flex-shrink: 0; margin-left: auto; }
  .category-toggle.collapsed { transform: rotate(-90deg); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  thead th { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 10px; white-space: nowrap; text-align: left; }
  thead th:first-child { padding-left: 24px; }
  thead th.r { text-align: right; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody td { padding: 7px 10px; vertical-align: middle; }
  tbody td:first-child { padding-left: 24px; }
  .item-name { font-size: 13px; font-weight: 500; }
  .item-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .mono { font-family: var(--mono); }

  /* DEAL ROW HIGHLIGHT */
  tbody tr.in-deal td:first-child { border-left: 3px solid var(--deal-colour, #888); padding-left: 21px; }

  /* INLINE INPUTS */
  .cell-input { background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--text); font-family: var(--sans); font-size: 13px; padding: 3px 6px; outline: none; transition: border-color 0.15s, background 0.15s; }
  .cell-input:hover { border-color: var(--border2); background: var(--surface); }
  .cell-input:focus { border-color: var(--accent); background: var(--surface2); }
  .cell-input.num { text-align: right; width: 80px; font-family: var(--mono); }
  .cell-input.wide { width: 150px; }
  .cell-input.changed { border-color: rgba(200,245,106,0.4); }

  /* GP COLOURS */
  .gp-high { color: var(--green); }
  .gp-mid  { color: var(--amber); }
  .gp-low  { color: var(--red); }
  .gp-na   { color: var(--text3); }

  /* STATUS SELECT (products table cell) */
  .status-select { background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--text3); font-family: var(--sans); font-size: 12px; padding: 3px 6px; outline: none; cursor: pointer; transition: border-color 0.15s, background 0.15s; appearance: none; -webkit-appearance: none; }
  .status-select:hover { border-color: var(--border2); background: var(--surface); }
  .status-select[data-status="Locked"]      { color: var(--accent); }
  .status-select[data-status="New"]         { color: #6ab4ff; }
  .status-select[data-status="Remove"]      { color: var(--red); }
  .status-select[data-status="Slow Moving"] { color: var(--amber); }
  .status-select[data-status="Order Issue"] { color: #ff9f6a; }

  /* DEAL PILLS (summary bar) */
  .sum-deal-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; border: 1px solid; white-space: nowrap; }
  .sum-deal-pill .pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sum-deal-pill .pill-sep { opacity: 0.35; margin: 0 1px; }
  .sum-deal-pill .pill-stat { font-family: var(--mono); font-size: 11px; }
  .sum-deal-pill .pill-ok  { color: var(--green); }
  .sum-deal-pill .pill-bad { color: var(--red); }

  /* BRAND DEALS TAB */
  .deals-toolbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .deals-grid { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .deal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

  /* STATS BUBBLE */
  .deal-stats-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); flex-wrap: wrap; }
  .stat-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid; }
  .stat-pill-locked { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: var(--text2); }
  .stat-pill-met    { background: rgba(106,223,153,0.12); border-color: rgba(106,223,153,0.3); color: var(--green); }
  .stat-pill-unmet  { background: rgba(255,107,107,0.10); border-color: rgba(255,107,107,0.3); color: var(--red); }
  .stat-pill-neutral{ background: rgba(255,193,74,0.10);  border-color: rgba(255,193,74,0.3);  color: var(--amber); }
  .req-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 12px; width: 46px; padding: 2px 6px; outline: none; text-align: center; margin-left: 2px; }
  .req-input:focus { border-color: var(--accent); }
  .req-label { font-size: 11px; color: var(--text3); margin-left: 4px; }

  .deal-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .deal-colour-swatch { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.1); transition: border-color 0.15s; }
  .deal-colour-swatch:hover { border-color: rgba(255,255,255,0.3); }
  .deal-name-input { background: transparent; border: none; color: var(--text); font-family: var(--sans); font-size: 14px; font-weight: 600; outline: none; flex: 1; }
  .deal-name-input:focus { background: var(--surface2); border-radius: 4px; padding: 2px 6px; }
  .deal-items-table { width: 100%; border-collapse: collapse; }
  .deal-items-table td { padding: 7px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; vertical-align: middle; }
  .deal-items-table tr:last-child td { border-bottom: none; }
  .deal-items-table .item-cat { font-size: 11px; color: var(--text3); }
  .deal-items-table tr.is-locked { background: rgba(255,255,255,0.025); }
  .deal-empty { padding: 16px; color: var(--text3); font-size: 12px; }
  .deal-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .no-deals-msg { padding: 48px 24px; text-align: center; color: var(--text3); font-size: 13px; }

  /* LOCK BUTTON */
  .lock-btn { background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 5px; cursor: pointer; color: var(--text3); transition: all 0.15s; line-height: 1; }
  .lock-btn:hover { border-color: var(--border2); color: var(--text2); }
  .lock-btn.locked { color: var(--accent); border-color: rgba(200,245,106,0.3); background: var(--accent-dim); }
  .locked-label { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-right: 4px; }

  /* COLOUR PICKER POPOVER */
  .colour-popover { position: absolute; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; width: 168px; z-index: 300; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .colour-option { width: 28px; height: 28px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.1s, transform 0.1s; }
  .colour-option:hover { transform: scale(1.12); }
  .colour-option.selected { border-color: #fff; }

  /* MODALS */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 460px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; flex-shrink: 0; }
  .modal-body { overflow-y: auto; flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-shrink: 0; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); }
  .form-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 10px; outline: none; width: 100%; }
  .form-input:focus { border-color: var(--accent); }

  /* ITEM PICKER */
  .item-picker-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .item-picker-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
  .item-picker-row:last-child { border-bottom: none; }
  .item-picker-row:hover { background: rgba(255,255,255,0.04); }
  .item-picker-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .item-picker-name { font-size: 13px; }
  .item-picker-cat { font-size: 11px; color: var(--text3); margin-left: auto; }

  /* GIST MODAL */
  .gist-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .gist-section:last-child { border-bottom: none; }
  .gist-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 8px; }
  .gist-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .gist-status-txt { font-size: 11px; font-family: var(--mono); color: var(--text3); }

  .hidden-row { display: none; }
  .no-items-msg { padding: 32px 24px; color: var(--text3); font-size: 13px; }
</style>
</head>
<body>

<div id="stickyTop">
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">Stock Manager</div>
    <div class="header-spacer"></div>
    <span class="sync-status" id="syncStatus"></span>
    <button class="btn" onclick="openGistModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Gist Sync
    </button>
    <a href="orders.html" class="btn" style="text-decoration:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="15 18 9 12 15 6"/></svg>
      Orders
    </a>
  </div>

  <!-- NAV TABS -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-products" onclick="switchTab('products')">Products</button>
    <button class="nav-tab" id="tab-deals" onclick="switchTab('deals')">Brand Deals <span id="dealsBadge" style="display:none;font-size:10px;background:var(--accent-dim2);color:var(--accent);border-radius:10px;padding:1px 6px;margin-left:4px"></span></button>
  </div>
</div>

<!-- ═══ PRODUCTS VIEW ═══ -->
<div class="view active" id="view-products">
  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search" type="text" placeholder="Search items…" oninput="doSearch(this.value)" style="width:210px">
    </div>
    <div class="chips" id="catChips">
      <button class="chip active" data-cat="all" onclick="setCatFilter('all',this)">All</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-sm btn-primary" onclick="openAddItemModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Item
    </button>
    <button class="btn btn-sm" onclick="autoSave()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
  </div>
  <div class="summary-bar">
    <div class="stat"><div class="stat-val" id="statItems">—</div><div class="stat-lbl">Items</div></div>
    <div class="stat"><div class="stat-val" id="statAvgGP">—</div><div class="stat-lbl">Avg GP%</div></div>
    <div class="stat"><div class="stat-val gp-high" id="statHighGP">—</div><div class="stat-lbl">High GP (&ge;60%)</div></div>
    <div class="stat"><div class="stat-val gp-low" id="statLowGP">—</div><div class="stat-lbl">Low GP (&lt;40%)</div></div>
    <div id="dealPillsWrap" style="display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-left:8px;padding-left:16px;border-left:1px solid var(--border)"></div>
  </div>
  <div id="productsContent"></div>
</div>

<!-- ═══ BRAND DEALS VIEW ═══ -->
<div class="view" id="view-deals">
  <div class="deals-toolbar">
    <button class="btn btn-primary" onclick="openNewDealModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Deal
    </button>
  </div>
  <div id="dealsContent"></div>
</div>

<!-- ═══ GIST MODAL ═══ -->
<div class="modal-overlay" id="gistModal">
  <div class="modal">
    <h3>Gist Sync</h3>
    <div class="modal-body">
      <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:8px">Active Gist</div>
        <div style="display:flex;gap:16px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="activeGist" value="lo" style="accent-color:var(--accent)" onchange="updateGistButtons()"> L&amp;O</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="activeGist" value="republic" style="accent-color:var(--accent)" onchange="updateGistButtons()"> Republic</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer"><input type="radio" name="activeGist" value="" style="accent-color:var(--accent)" onchange="updateGistButtons()"> None</label>
        </div>
      </div>
      <div id="gistDefList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('gistModal')">Close</button>
      <button class="btn btn-primary" onclick="saveGistSettings()">Save Settings</button>
    </div>
  </div>
</div>

<!-- ═══ NEW DEAL MODAL ═══ -->
<div class="modal-overlay" id="newDealModal">
  <div class="modal" style="max-height:unset">
    <h3>New Brand Deal</h3>
    <div class="form-row">
      <div class="form-label">Deal Name</div>
      <input class="form-input" id="newDealName" type="text" placeholder="e.g. Diageo Partnership">
    </div>
    <div class="form-row">
      <div class="form-label">Colour</div>
      <div id="newDealColours" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('newDealModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createDeal()">Create Deal</button>
    </div>
  </div>
</div>

<!-- ═══ ADD ITEMS MODAL ═══ -->
<div class="modal-overlay" id="addItemsModal">
  <div class="modal">
    <h3 id="addItemsTitle">Add Items to Deal</h3>
    <div class="form-row" style="flex-shrink:0">
      <input class="form-input" id="itemPickerSearch" type="text" placeholder="Search items…" oninput="filterItemPicker(this.value)">
    </div>
    <div class="modal-body">
      <div class="item-picker-list" id="itemPickerList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addItemsModal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmAddItems()">Add Selected</button>
    </div>
  </div>
</div>

<!-- ═══ ADD ITEM MODAL ═══ -->
<div class="modal-overlay" id="addItemModal">
  <div class="modal" style="max-height:unset">
    <h3>Add Item</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
      <div class="form-row" style="grid-column:1/-1">
        <div class="form-label">Item Name</div>
        <input class="form-input" id="ai-name" type="text" placeholder="e.g. Grey Goose">
      </div>
      <div class="form-row">
        <div class="form-label">Category</div>
        <select class="form-input" id="ai-category"></select>
      </div>
      <div class="form-row">
        <div class="form-label">Size</div>
        <input class="form-input" id="ai-size" type="text" placeholder="e.g. 700ml">
      </div>
      <div class="form-row">
        <div class="form-label">Supplier</div>
        <input class="form-input" id="ai-supplier" type="text" placeholder="e.g. ILG">
      </div>
      <div class="form-row">
        <div class="form-label">Brand Owner</div>
        <input class="form-input" id="ai-brand-owner" type="text" placeholder="e.g. Diageo">
      </div>
      <div class="form-row">
        <div class="form-label">Cost</div>
        <input class="form-input" id="ai-cost" type="number" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="form-row">
        <div class="form-label">Sell</div>
        <input class="form-input" id="ai-sell" type="number" step="0.01" min="0" placeholder="0.00">
      </div>
    </div>
    <div style="margin-top:4px;padding:10px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
        <input type="checkbox" id="ai-include-orders" style="accent-color:var(--accent);width:14px;height:14px">
        Include in orders
      </label>
      <div style="font-size:11px;color:var(--text3);margin-top:4px;margin-left:22px">Off by default — turn on to show this item in orders.html</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addItemModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewItem()">Add Item</button>
    </div>
  </div>
</div>

<!-- colour popover (appended to body, positioned by JS) -->
<div id="colourPopover" class="colour-popover" style="display:none"></div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const GIST_DEFS = [
  { id: 'lo',       label: 'L&O',     filename: 'lo-data.json' },
  { id: 'republic', label: 'Republic', filename: 'republic-data.json' }
];

const CATEGORIES = [
  'Vodka','Gin','Tequila & Mezcal','Rum','Scotch','Bourbon & Whiskey',
  'Liqueurs','Other','Wines','Packaged','Kegs','Gas',
  'Post-Mix Syrups','Fruit & Juice','Consumables','Chemicals'
];

const SPIRIT_CATS = new Set(['Vodka','Gin','Tequila & Mezcal','Rum','Scotch','Bourbon & Whiskey','Liqueurs']);

const DEAL_COLOURS = [
  '#6ab4ff','#6adf99','#ffc14a','#ff6b6b','#c8f56a',
  '#b06aff','#ff6ab4','#6affdf','#ff9f6a','#a0c4ff'
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = loadState();
let searchQ = '';
let activeCat = 'all';
let activeTab = 'products';

// deal modal working state
let _addItemsDealId = null;

function loadState() {
  try {
    const s = localStorage.getItem('stockorder_v2');
    if (s) return normalise(JSON.parse(s));
  } catch(e) {}
  return { weekNum:1, weekStart:'', items:{}, catalog:[], venues:[], productOverrides:{}, brandDeals:[] };
}

function normalise(s) {
  if (!s || typeof s !== 'object' || Array.isArray(s)) s = {};
  if (!s.items || Array.isArray(s.items)) s.items = {};
  if (!s.catalog || !Array.isArray(s.catalog)) s.catalog = [];
  if (!s.productOverrides) s.productOverrides = {};
  if (!s.brandDeals || !Array.isArray(s.brandDeals)) s.brandDeals = [];
  return s;
}

function saveState() {
  try { localStorage.setItem('stockorder_v2', JSON.stringify(state)); } catch(e) { alert('Save failed: ' + e.message); }
}

function autoSave() {
  saveState();
  setSyncStatus('Saved ✓', 1800);
}

// ─── ITEMS ────────────────────────────────────────────────────────────────────
function getAllItems() {
  const deleted = new Set(state.deletedIds || []);
  const overrides = state.productOverrides || {};
  return (state.catalog || []).filter(m => !deleted.has(m.id)).map(m => {
    const ov = overrides[m.id] || {};
    return { ...m, ...ov };
  });
}

function setField(id, field, value) {
  if (!state.productOverrides) state.productOverrides = {};
  if (!state.productOverrides[id]) state.productOverrides[id] = {};
  if (value === '' || value === null || value === undefined) {
    delete state.productOverrides[id][field];
  } else {
    state.productOverrides[id][field] = value;
  }
  saveState();
}

// ─── DEAL LOOKUPS ─────────────────────────────────────────────────────────────
function getDealForItem(itemId) {
  return (state.brandDeals || []).find(d => d.itemIds && d.itemIds.includes(itemId)) || null;
}

// ─── CALCULATIONS ─────────────────────────────────────────────────────────────
function parseSizeMl(sizeStr) {
  if (!sizeStr) return null;
  const s = String(sizeStr).toLowerCase().trim();
  const lm = s.match(/^([\d.]+)\s*l$/);  if (lm) return parseFloat(lm[1]) * 1000;
  const mm = s.match(/^([\d.]+)\s*ml$/); if (mm) return parseFloat(mm[1]);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function calcGP(m) {
  const sell = parseFloat(m.sell), cost = parseFloat(m.cost);
  if (!sell || !cost || sell <= 0 || cost <= 0) return null;
  if (SPIRIT_CATS.has(m.category)) {
    const ml = parseSizeMl(m.size);
    if (!ml) return null;
    return (sell - (cost / ml * 30)) / sell;
  }
  return (sell - cost) / sell;
}

function gpClass(gp) {
  if (gp === null) return 'gp-na';
  if (gp >= 0.6) return 'gp-high';
  if (gp >= 0.4) return 'gp-mid';
  return 'gp-low';
}

function fmtPct(n) {
  if (n === null) return '—';
  return (n * 100).toFixed(1) + '%';
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function catKey(cat) { return cat.replace(/\s+/g,'-').replace(/[&]/g,'n'); }

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'deals') renderDeals();
}

// ─── SEARCH & FILTER ──────────────────────────────────────────────────────────
function doSearch(q) { searchQ = q.toLowerCase(); applyFilters(); }

function setCatFilter(cat, el) {
  activeCat = cat;
  document.querySelectorAll('.chip[data-cat]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  getAllItems().forEach(m => {
    const row = document.getElementById('smrow-' + m.id);
    if (!row) return;
    let show = true;
    if (searchQ) show = m.item.toLowerCase().includes(searchQ) || (m.supplier||'').toLowerCase().includes(searchQ) || (m.brand_owner||'').toLowerCase().includes(searchQ);
    if (show && activeCat !== 'all') show = m.category === activeCat;
    row.classList.toggle('hidden-row', !show);
  });
  updateCatCounts();
  updateSummary();
}

function updateCatCounts() {
  const allItems = getAllItems();
  const cats = [...new Set(allItems.map(m => m.category))];
  cats.forEach(cat => {
    const key = catKey(cat);
    const vis = allItems.filter(m => m.category === cat && !document.getElementById('smrow-' + m.id)?.classList.contains('hidden-row')).length;
    const el = document.getElementById('smcount-' + key);
    if (el) el.textContent = vis + ' items';
    const body = document.getElementById('smbody-' + key);
    if (body) body.closest('.category-section').style.display = vis === 0 ? 'none' : '';
  });
}

// ─── SUMMARY ──────────────────────────────────────────────────────────────────
function updateSummary() {
  const visible = getAllItems().filter(m => !document.getElementById('smrow-' + m.id)?.classList.contains('hidden-row'));
  const withGP = visible.filter(m => calcGP(m) !== null);
  const avg = withGP.length ? withGP.reduce((s, m) => s + calcGP(m), 0) / withGP.length : null;
  const high = withGP.filter(m => calcGP(m) >= 0.6).length;
  const low  = withGP.filter(m => calcGP(m) < 0.4).length;
  document.getElementById('statItems').textContent = visible.length;
  document.getElementById('statAvgGP').textContent = avg !== null ? fmtPct(avg) : '—';
  document.getElementById('statHighGP').textContent = high;
  document.getElementById('statLowGP').textContent = low;

  // deal pills
  const deals = state.brandDeals || [];
  const wrap = document.getElementById('dealPillsWrap');
  if (!deals.length) {
    wrap.style.display = 'none';
  } else {
    wrap.style.display = 'flex';
    wrap.innerHTML = deals.map(deal => {
      const st = dealStats(deal);
      const lockPart = `<span class="pill-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10" height="10" style="vertical-align:-1px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> ${st.locked}</span>`;
      let varPart = '';
      if (st.required > 0) {
        const ok = st.variableMet;
        varPart = `<span class="pill-sep">·</span><span class="pill-stat ${ok ? 'pill-ok' : 'pill-bad'}">${st.variable}/${st.required}</span>`;
      } else if (st.variable > 0) {
        varPart = `<span class="pill-sep">·</span><span class="pill-stat">${st.variable} var</span>`;
      }
      return `<span class="sum-deal-pill" style="background:${deal.colour}14;border-color:${deal.colour}50;color:var(--text)">
        <span class="pill-dot" style="background:${deal.colour}"></span>
        ${esc(deal.name)}
        <span class="pill-sep">·</span>
        ${lockPart}${varPart}
      </span>`;
    }).join('');
  }

  // deals tab badge
  const totalInDeals = getAllItems().filter(m => getDealForItem(m.id)).length;
  const badge = document.getElementById('dealsBadge');
  badge.textContent = totalInDeals;
  badge.style.display = totalInDeals > 0 ? '' : 'none';
}

// ─── PRODUCTS RENDER ──────────────────────────────────────────────────────────
function renderProducts() {
  const allItems = getAllItems();
  const cats = [...new Set(allItems.map(m => m.category))].sort((a, b) => {
    return (CATEGORIES.indexOf(a) + 1 || 999) - (CATEGORIES.indexOf(b) + 1 || 999);
  });

  const chipsEl = document.getElementById('catChips');
  chipsEl.innerHTML = '<button class="chip active" data-cat="all" onclick="setCatFilter(\'all\',this)">All</button>';
  cats.forEach(cat => {
    chipsEl.innerHTML += `<button class="chip" data-cat="${esc(cat)}" onclick="setCatFilter('${cat.replace(/'/g,"\\'")}',this)">${cat}</button>`;
  });

  const content = document.getElementById('productsContent');
  content.innerHTML = '';

  if (!allItems.length) {
    content.innerHTML = '<div class="no-items-msg">No items found. Pull from Gist to load your product list.</div>';
    updateSummary();
    return;
  }

  cats.forEach(cat => {
    const items = allItems.filter(m => m.category === cat).sort((a, b) => (a.position||99) - (b.position||99) || a.item.localeCompare(b.item));
    const key = catKey(cat);
    const section = document.createElement('div');
    section.className = 'category-section';
    section.innerHTML = `
      <div class="category-header" onclick="toggleCat('${key}')">
        <div class="category-name">${cat}</div>
        <div class="category-count" id="smcount-${key}">${items.length} items</div>
        <svg class="category-toggle" id="smtoggle-${key}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="table-wrap" id="smbody-${key}">
        <table>
          <thead><tr>
            <th style="width:220px">Item</th>
            <th style="width:80px">Size</th>
            <th style="width:110px">Supplier</th>
            <th class="r" style="width:88px">Cost</th>
            <th class="r" style="width:88px">Sell</th>
            <th class="r" style="width:72px" title="Spirits: per 30ml serve. Others: per unit.">GP%</th>
            <th style="width:150px">Brand Owner</th>
            <th style="width:140px">Status</th>
          </tr></thead>
          <tbody id="smtbody-${key}"></tbody>
        </table>
      </div>`;
    content.appendChild(section);

    const tbody = document.getElementById('smtbody-' + key);
    items.forEach(m => {
      const gp = calcGP(m);
      const cls = gpClass(gp);
      const deal = getDealForItem(m.id);
      const tr = document.createElement('tr');
      tr.id = 'smrow-' + m.id;
      if (deal) {
        tr.classList.add('in-deal');
        tr.style.setProperty('--deal-colour', deal.colour);
        tr.style.background = deal.colour + '12';
      }
      tr.innerHTML = `
        <td>
          <div class="item-name">${esc(m.item)}</div>
          ${m.size ? `<div class="item-sub">${esc(m.size)}</div>` : ''}
        </td>
        <td style="color:var(--text3);font-size:12px">${esc(m.size||'')}</td>
        <td style="color:var(--text2);font-size:12px">${esc(m.supplier||'')}</td>
        <td style="text-align:right">
          <input class="cell-input num" type="number" step="0.01" min="0"
            value="${m.cost ? Number(m.cost).toFixed(2) : ''}" placeholder="—"
            onchange="fieldChanged('${m.id}','cost',this)"
            oninput="this.classList.add('changed')">
        </td>
        <td style="text-align:right">
          <input class="cell-input num" type="number" step="0.01" min="0"
            value="${m.sell ? Number(m.sell).toFixed(2) : ''}" placeholder="—"
            onchange="fieldChanged('${m.id}','sell',this)"
            oninput="this.classList.add('changed')">
        </td>
        <td class="mono ${cls}" style="text-align:right;font-size:13px;font-weight:500" id="gpp-${m.id}">${fmtPct(gp)}</td>
        <td>
          <input class="cell-input wide" type="text"
            value="${esc(m.brand_owner||'')}" placeholder="—"
            onchange="fieldChanged('${m.id}','brand_owner',this)"
            oninput="this.classList.add('changed')">
        </td>
        <td>
          <select class="status-select" data-status="${esc(m.itemStatus||'')}"
            onchange="setItemStatus('${m.id}',this.value,this)">
            <option value="">-</option>
            <option value="Locked"${m.itemStatus==='Locked'?' selected':''}>Locked</option>
            <option value="New"${m.itemStatus==='New'?' selected':''}>New</option>
            <option value="Remove"${m.itemStatus==='Remove'?' selected':''}>Remove</option>
            <option value="Slow Moving"${m.itemStatus==='Slow Moving'?' selected':''}>Slow Moving</option>
            <option value="Order Issue"${m.itemStatus==='Order Issue'?' selected':''}>Order Issue</option>
          </select>
        </td>`;
      tbody.appendChild(tr);
    });
  });

  updateSummary();
}

function toggleCat(key) {
  const body = document.getElementById('smbody-' + key);
  const tog  = document.getElementById('smtoggle-' + key);
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  tog.classList.toggle('collapsed', !hidden);
}

function setItemStatus(id, value, selectEl) {
  setField(id, 'itemStatus', value);
  selectEl.setAttribute('data-status', value);
}

function fieldChanged(id, field, input) {
  input.classList.remove('changed');
  const raw = input.value.trim();
  const isNum = field === 'cost' || field === 'sell';
  setField(id, field, isNum ? (raw === '' ? '' : parseFloat(raw) || 0) : raw);
  if (isNum) {
    const m = getAllItems().find(x => x.id === id);
    if (m) {
      const gp = calcGP(m);
      const el = document.getElementById('gpp-' + id);
      if (el) { el.textContent = fmtPct(gp); el.className = `mono ${gpClass(gp)}`; el.style.textAlign = 'right'; el.style.fontSize = '13px'; el.style.fontWeight = '500'; }
      updateSummary();
    }
  }
}

// ─── BRAND DEALS RENDER ───────────────────────────────────────────────────────
function dealStats(deal) {
  const locked   = (deal.lockedItemIds || []).length;
  const variable = (deal.itemIds || []).filter(id => !(deal.lockedItemIds || []).includes(id)).length;
  const required = deal.requiredCount || 0;
  const variableMet = required > 0 && variable >= required;
  const variableShort = required > 0 && variable < required;
  return { locked, variable, required, variableMet, variableShort };
}

function renderDeals() {
  const content = document.getElementById('dealsContent');
  const deals = state.brandDeals || [];

  if (!deals.length) {
    content.innerHTML = '<div class="no-deals-msg">No brand deals yet. Click <strong>New Deal</strong> to create one.</div>';
    return;
  }

  const allItems = getAllItems();
  content.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'deals-grid';

  deals.forEach(deal => {
    const lockedIds  = new Set(deal.lockedItemIds || []);
    const dealItems  = allItems.filter(m => (deal.itemIds || []).includes(m.id))
      .sort((a, b) => {
        // locked items first
        const al = lockedIds.has(a.id), bl = lockedIds.has(b.id);
        if (al !== bl) return al ? -1 : 1;
        return a.item.localeCompare(b.item);
      });
    const st = dealStats(deal);
    const card = document.createElement('div');
    card.className = 'deal-card';
    card.style.borderLeft = `3px solid ${deal.colour}`;

    // ── stats bubble ──
    const lockedPill = `
      <span class="stat-pill stat-pill-locked">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        ${st.locked} locked
      </span>`;

    let variablePill = '';
    if (st.required > 0) {
      const pillClass = st.variableMet ? 'stat-pill-met' : 'stat-pill-unmet';
      const icon = st.variableMet
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      variablePill = `<span class="stat-pill ${pillClass}">${icon} ${st.variable} / ${st.required} variable</span>`;
    } else {
      variablePill = `<span class="stat-pill stat-pill-neutral">${st.variable} variable</span>`;
    }

    const reqEditor = `
      <span class="req-label">Required variable:</span>
      <input class="req-input" type="number" min="0" value="${st.required}"
        onchange="setRequiredCount('${deal.id}',this.value)" title="How many variable items are required">`;

    // ── item rows ──
    const itemRows = dealItems.length
      ? dealItems.map(m => {
          const isLocked = lockedIds.has(m.id);
          return `
          <tr class="${isLocked ? 'is-locked' : ''}">
            <td style="width:28px;padding-right:4px">
              <button class="lock-btn${isLocked ? ' locked' : ''}" title="${isLocked ? 'Locked — click to make variable' : 'Variable — click to lock'}"
                onclick="toggleLockItem('${deal.id}','${m.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
                  ${isLocked
                    ? `<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`
                    : `<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>`}
                </svg>
              </button>
            </td>
            <td>
              ${isLocked ? '<span class="locked-label">Locked</span>' : ''}
              <span style="font-weight:500">${esc(m.item)}</span>
              <div class="item-cat">${esc(m.category)}${m.supplier ? ' · ' + esc(m.supplier) : ''}</div>
            </td>
            <td style="text-align:right;padding-right:8px;white-space:nowrap">
              <button class="btn btn-sm btn-danger" onclick="removeItemFromDeal('${deal.id}','${m.id}')">Remove</button>
            </td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="3" class="deal-empty">No items in this deal yet.</td></tr>`;

    card.innerHTML = `
      <div class="deal-stats-bar">${lockedPill}${variablePill}<span style="flex:1"></span>${reqEditor}</div>
      <div class="deal-card-header">
        <div class="deal-colour-swatch" id="swatch-${deal.id}" style="background:${deal.colour}" onclick="openColourPicker('${deal.id}',this)" title="Change colour"></div>
        <input class="deal-name-input" type="text" value="${esc(deal.name)}" placeholder="Deal name"
          onchange="renameDeal('${deal.id}',this.value)">
        <button class="btn btn-sm btn-danger" onclick="deleteDeal('${deal.id}')">Delete Deal</button>
      </div>
      <table class="deal-items-table">${itemRows}</table>
      <div class="deal-footer">
        <button class="btn btn-sm" onclick="openAddItemsModal('${deal.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Items
        </button>
        <span style="font-size:11px;color:var(--text3);margin-left:4px">${dealItems.length} item${dealItems.length !== 1 ? 's' : ''}</span>
      </div>`;
    grid.appendChild(card);
  });

  content.appendChild(grid);
}

// ─── DEAL MANAGEMENT ──────────────────────────────────────────────────────────
let _newDealColour = DEAL_COLOURS[0];

function openNewDealModal() {
  _newDealColour = DEAL_COLOURS[0];
  document.getElementById('newDealName').value = '';
  const wrap = document.getElementById('newDealColours');
  wrap.innerHTML = DEAL_COLOURS.map(c => `
    <div class="colour-option${c === _newDealColour ? ' selected' : ''}"
      style="background:${c}" title="${c}"
      onclick="selectNewDealColour('${c}',this)"></div>`).join('');
  document.getElementById('newDealModal').classList.add('open');
  setTimeout(() => document.getElementById('newDealName').focus(), 50);
}

function selectNewDealColour(colour, el) {
  _newDealColour = colour;
  document.querySelectorAll('#newDealColours .colour-option').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function createDeal() {
  const name = document.getElementById('newDealName').value.trim();
  if (!name) { document.getElementById('newDealName').focus(); return; }
  if (!state.brandDeals) state.brandDeals = [];
  state.brandDeals.push({ id: crypto.randomUUID(), name, colour: _newDealColour, itemIds: [], lockedItemIds: [], requiredCount: 0 });
  saveState();
  closeModal('newDealModal');
  renderDeals();
  updateSummary();
}

function renameDeal(dealId, name) {
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  if (deal) { deal.name = name.trim() || deal.name; saveState(); }
  // refresh products view deal badge without full re-render
  refreshDealBadgesInProducts();
  updateSummary();
}

function deleteDeal(dealId) {
  if (!confirm('Delete this deal? Items will no longer be highlighted.')) return;
  state.brandDeals = (state.brandDeals || []).filter(d => d.id !== dealId);
  saveState();
  renderDeals();
  renderProducts();
}

function removeItemFromDeal(dealId, itemId) {
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  if (!deal) return;
  deal.itemIds = (deal.itemIds || []).filter(id => id !== itemId);
  deal.lockedItemIds = (deal.lockedItemIds || []).filter(id => id !== itemId);
  saveState();
  renderDeals();
  renderProducts();
}

function toggleLockItem(dealId, itemId) {
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  if (!deal) return;
  if (!deal.lockedItemIds) deal.lockedItemIds = [];
  if (deal.lockedItemIds.includes(itemId)) {
    deal.lockedItemIds = deal.lockedItemIds.filter(id => id !== itemId);
  } else {
    deal.lockedItemIds.push(itemId);
  }
  saveState();
  renderDeals();
}

function setRequiredCount(dealId, value) {
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  if (!deal) return;
  deal.requiredCount = Math.max(0, parseInt(value) || 0);
  saveState();
  renderDeals();
}

function refreshDealBadgesInProducts() {
  getAllItems().forEach(m => {
    const row = document.getElementById('smrow-' + m.id);
    if (!row) return;
    const deal = getDealForItem(m.id);
    if (deal) {
      row.classList.add('in-deal');
      row.style.setProperty('--deal-colour', deal.colour);
      row.style.background = deal.colour + '12';
    } else {
      row.classList.remove('in-deal');
      row.style.removeProperty('--deal-colour');
      row.style.background = '';
    }
  });
}

// ─── COLOUR PICKER ────────────────────────────────────────────────────────────
let _colourPickerDealId = null;

function openColourPicker(dealId, swatchEl) {
  _colourPickerDealId = dealId;
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  const pop = document.getElementById('colourPopover');
  pop.innerHTML = DEAL_COLOURS.map(c => `
    <div class="colour-option${deal && deal.colour === c ? ' selected' : ''}"
      style="background:${c}" onclick="pickColour('${c}')"></div>`).join('');
  const rect = swatchEl.getBoundingClientRect();
  pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  pop.style.left = rect.left + 'px';
  pop.style.display = 'flex';
}

function pickColour(colour) {
  const deal = (state.brandDeals || []).find(d => d.id === _colourPickerDealId);
  if (!deal) return;
  deal.colour = colour;
  saveState();
  document.getElementById('colourPopover').style.display = 'none';
  renderDeals();
  renderProducts();
}

document.addEventListener('click', e => {
  const pop = document.getElementById('colourPopover');
  if (pop.style.display !== 'none' && !pop.contains(e.target) && !e.target.classList.contains('deal-colour-swatch')) {
    pop.style.display = 'none';
  }
});

// ─── ADD ITEMS MODAL ──────────────────────────────────────────────────────────
function openAddItemsModal(dealId) {
  _addItemsDealId = dealId;
  const deal = (state.brandDeals || []).find(d => d.id === dealId);
  document.getElementById('addItemsTitle').textContent = `Add Items — ${deal ? deal.name : ''}`;
  document.getElementById('itemPickerSearch').value = '';
  buildItemPickerList('');
  document.getElementById('addItemsModal').classList.add('open');
}

function buildItemPickerList(q) {
  const deal = (state.brandDeals || []).find(d => d.id === _addItemsDealId);
  const alreadyIn = new Set(deal ? deal.itemIds : []);
  const items = getAllItems()
    .filter(m => !alreadyIn.has(m.id))
    .filter(m => !q || m.item.toLowerCase().includes(q) || (m.category||'').toLowerCase().includes(q) || (m.supplier||'').toLowerCase().includes(q))
    .sort((a, b) => {
      const ai = CATEGORIES.indexOf(a.category), bi = CATEGORIES.indexOf(b.category);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi) || a.item.localeCompare(b.item);
    });

  const list = document.getElementById('itemPickerList');
  if (!items.length) {
    list.innerHTML = '<div style="padding:16px;color:var(--text3);font-size:12px">No items to add.</div>';
    return;
  }
  list.innerHTML = items.map(m => `
    <label class="item-picker-row">
      <input type="checkbox" value="${m.id}">
      <span class="item-picker-name">${esc(m.item)}</span>
      <span class="item-picker-cat">${esc(m.category)}</span>
    </label>`).join('');
}

function filterItemPicker(q) {
  buildItemPickerList(q.toLowerCase());
}

function confirmAddItems() {
  const deal = (state.brandDeals || []).find(d => d.id === _addItemsDealId);
  if (!deal) return;
  const checked = [...document.querySelectorAll('#itemPickerList input[type="checkbox"]:checked')];
  if (!checked.length) { closeModal('addItemsModal'); return; }
  if (!deal.itemIds) deal.itemIds = [];
  checked.forEach(cb => {
    if (!deal.itemIds.includes(cb.value)) deal.itemIds.push(cb.value);
  });
  saveState();
  closeModal('addItemsModal');
  renderDeals();
  renderProducts();
}

// ─── GIST SYNC ────────────────────────────────────────────────────────────────
function loadGistConfig() {
  try { return JSON.parse(localStorage.getItem('stockorder_gist_config') || '{}'); } catch(e) { return {}; }
}
function saveGistConfigRaw(cfg) {
  localStorage.setItem('stockorder_gist_config', JSON.stringify(cfg));
}

function openGistModal() {
  const cfg = loadGistConfig();
  const active = cfg.activeGist || '';
  document.querySelectorAll('input[name="activeGist"]').forEach(r => { r.checked = r.value === active; });
  document.getElementById('gistDefList').innerHTML = GIST_DEFS.map(def => {
    const c = cfg[def.id] || {};
    const disabled = !c.gistId || !c.token || active !== def.id;
    return `
    <div class="gist-section">
      <div class="gist-section-title">${def.label} <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${def.filename}</span></div>
      <div class="form-row"><div class="form-label">Gist ID</div>
        <input class="form-input" id="gid-${def.id}" type="text" placeholder="Gist ID" value="${esc(c.gistId||'')}" style="font-family:var(--mono);font-size:12px">
      </div>
      <div class="form-row"><div class="form-label">Token</div>
        <input class="form-input" id="gtoken-${def.id}" type="password" placeholder="GitHub Personal Access Token" value="${esc(c.token||'')}" style="font-family:var(--mono);font-size:12px">
      </div>
      <div class="gist-actions">
        <button id="gbtn-pull-${def.id}" class="btn btn-sm" ${disabled?'disabled':''} onclick="pullFromGist('${def.id}')">Pull</button>
        <button id="gbtn-push-${def.id}" class="btn btn-sm" ${disabled?'disabled':''} onclick="pushToGist('${def.id}')">Push</button>
        <span id="gstatus-${def.id}" class="gist-status-txt"></span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('gistModal').classList.add('open');
}

function updateGistButtons() {
  const active = (document.querySelector('input[name="activeGist"]:checked') || {}).value || '';
  GIST_DEFS.forEach(def => {
    const gid = (document.getElementById('gid-' + def.id)||{}).value?.trim();
    const tok = (document.getElementById('gtoken-' + def.id)||{}).value?.trim();
    const disabled = !gid || !tok || active !== def.id;
    ['pull','push'].forEach(a => {
      const btn = document.getElementById(`gbtn-${a}-${def.id}`);
      if (btn) btn.disabled = disabled;
    });
  });
}

function saveGistSettings() {
  const cfg = loadGistConfig();
  cfg.activeGist = (document.querySelector('input[name="activeGist"]:checked') || {}).value || '';
  GIST_DEFS.forEach(def => {
    cfg[def.id] = {
      gistId: (document.getElementById('gid-' + def.id)||{}).value?.trim() || '',
      token:  (document.getElementById('gtoken-' + def.id)||{}).value?.trim() || ''
    };
  });
  saveGistConfigRaw(cfg);
  closeModal('gistModal');
  setSyncStatus('Settings saved', 2000);
}

async function pullFromGist(defId) {
  const def = GIST_DEFS.find(d => d.id === defId);
  const cfg = loadGistConfig();
  const gistId = (document.getElementById('gid-' + defId)||{}).value?.trim() || (cfg[defId]||{}).gistId;
  const token  = (document.getElementById('gtoken-' + defId)||{}).value?.trim() || (cfg[defId]||{}).token;
  if (!gistId || !token) { alert('Enter a Gist ID and token first.'); return; }
  if (!confirm(`Pull from ${def.label}? This will overwrite your local data.`)) return;
  const statusEl = document.getElementById('gstatus-' + defId);
  statusEl.textContent = 'Pulling…';
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();
    const file = data.files[def.filename];
    if (!file) throw new Error(`${def.filename} not found in gist`);
    const pulled = normalise(JSON.parse(file.content));
    localStorage.setItem('stockorder_v2', JSON.stringify(pulled));
    state = pulled;
    statusEl.textContent = `Pulled ✓ (${(state.catalog||[]).length} items)`;
    closeModal('gistModal');
    renderProducts();
    setSyncStatus(`Pulled from ${def.label} ✓`, 3000);
  } catch(err) {
    statusEl.textContent = 'Pull failed: ' + err.message;
  }
}

async function pushToGist(defId) {
  const def = GIST_DEFS.find(d => d.id === defId);
  const cfg = loadGistConfig();
  const gistId = (document.getElementById('gid-' + defId)||{}).value?.trim() || (cfg[defId]||{}).gistId;
  const token  = (document.getElementById('gtoken-' + defId)||{}).value?.trim() || (cfg[defId]||{}).token;
  if (!gistId || !token) { alert('Enter a Gist ID and token first.'); return; }
  const statusEl = document.getElementById('gstatus-' + defId);
  statusEl.textContent = 'Pushing…';
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [def.filename]: { content: JSON.stringify(state, null, 2) } } })
    });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    statusEl.textContent = `Pushed ✓ (${(state.catalog||[]).length} items)`;
    setSyncStatus(`Pushed to ${def.label} ✓`, 3000);
  } catch(err) {
    statusEl.textContent = 'Push failed: ' + err.message;
  }
}

// ─── ADD ITEM ─────────────────────────────────────────────────────────────────
function openAddItemModal() {
  document.getElementById('ai-name').value = '';
  document.getElementById('ai-size').value = '';
  document.getElementById('ai-supplier').value = '';
  document.getElementById('ai-brand-owner').value = '';
  document.getElementById('ai-cost').value = '';
  document.getElementById('ai-sell').value = '';
  document.getElementById('ai-include-orders').checked = false;
  const sel = document.getElementById('ai-category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${esc(c)}">${c}</option>`).join('');
  document.getElementById('addItemModal').classList.add('open');
  setTimeout(() => document.getElementById('ai-name').focus(), 50);
}

function saveNewItem() {
  const name = document.getElementById('ai-name').value.trim();
  if (!name) { document.getElementById('ai-name').focus(); return; }
  const id = crypto.randomUUID();
  const item = {
    id,
    item:             name,
    category:         document.getElementById('ai-category').value,
    size:             document.getElementById('ai-size').value.trim(),
    supplier:         document.getElementById('ai-supplier').value.trim(),
    brand_owner:      document.getElementById('ai-brand-owner').value.trim(),
    cost:             parseFloat(document.getElementById('ai-cost').value) || 0,
    sell:             parseFloat(document.getElementById('ai-sell').value) || 0,
    excludeFromOrders: !document.getElementById('ai-include-orders').checked,
    case:     1,
    baseline: 0,
    position: 99,
    risk_tier: 'normal',
  };
  if (!state.catalog) state.catalog = [];
  if (!state.items) state.items = {};
  state.catalog.push(item);
  state.items[id] = { count:0, ordered:0, count_prev:0, used_0:0, used_1:0, used_2:0, used_3:0, received:0 };
  saveState();
  closeModal('addItemModal');
  renderProducts();
}

// ─── UTILITIES ────────────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

let _statusTimer = null;
function setSyncStatus(msg, clearMs) {
  document.getElementById('syncStatus').textContent = msg;
  if (_statusTimer) clearTimeout(_statusTimer);
  if (clearMs) _statusTimer = setTimeout(() => { document.getElementById('syncStatus').textContent = ''; }, clearMs);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderProducts();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktail Spec Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f7f3ec;
    --cream: #ede8df;
    --gold: #b8860b;
    --gold-light: #e8d5a0;
    --gold-pale: #f5edd8;
    --amber: #c8760a;
    --muted: #7a6e5f;
    --rule: #d4c9b5;
    --sig: #1a1208;
    --classic: #2c3e2d;
    --na: #2d3a4a;
    --danger: #8b2e2e;
    --card-bg: #ffffff;
    --section-sig: #fdf8f0;
    --section-classic: #f5f8f5;
    --section-na: #f3f6f9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--ink);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 3px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--paper);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-left p {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gold-light);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .header-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold-light);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { background: var(--gold); color: var(--ink); }

  .btn-primary {
    background: var(--gold);
    color: var(--ink);
    font-weight: 500;
  }

  .btn-primary:hover { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* TABS */
  .tabs {
    background: var(--cream);
    border-bottom: 1px solid var(--rule);
    padding: 0 40px;
    display: flex;
    gap: 0;
  }

  .tab {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 14px 24px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tab:hover { color: var(--ink); }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
    font-weight: 500;
  }

  .tab-count {
    background: var(--gold);
    color: var(--ink);
    font-size: 9px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }

  .tab.active .tab-count { background: var(--ink); color: var(--gold); }

  /* MAIN */
  main { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title span {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    font-style: normal;
    text-transform: uppercase;
    border: 1px solid var(--rule);
    padding: 3px 10px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    border: 1px dashed var(--rule);
    background: var(--card-bg);
  }

  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .card:hover {
    box-shadow: 0 8px 32px rgba(26,18,8,0.10);
    transform: translateY(-2px);
  }

  .card-accent {
    height: 3px;
    width: 100%;
  }

  .sig .card-accent { background: var(--gold); }
  .classic .card-accent { background: var(--classic); }
  .na .card-accent { background: var(--na); }

  .card-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--ink);
    line-height: 1.2;
    flex: 1;
    padding-right: 12px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: var(--paper);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .icon-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-pale); }
  .icon-btn.delete:hover { border-color: var(--danger); color: var(--danger); background: #fdf2f2; }

  .card-body { padding: 16px 20px; }

  .card-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--rule);
    color: var(--muted);
    background: var(--paper);
  }

  .meta-tag.glass { border-color: var(--gold-light); color: var(--amber); background: var(--gold-pale); }

  .spec-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 12px;
  }

  .spec-label:first-child { margin-top: 0; }

  .ingredients-list {
    list-style: none;
  }

  .ingredients-list li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 13px;
  }

  .ingredients-list li:last-child { border-bottom: none; }

  .ing-name { color: var(--ink); }

  .ing-vol {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .spec-text {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }

  .card-footer {
    padding: 10px 20px;
    border-top: 1px solid var(--rule);
    background: var(--paper);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-garnish {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .footer-garnish strong {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-style: normal;
    color: var(--muted);
    margin-right: 4px;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,18,8,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card-bg);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    border-top: 4px solid var(--gold);
    box-shadow: 0 24px 80px rgba(26,18,8,0.3);
  }

  .modal-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--card-bg);
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--ink);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .modal-close:hover { color: var(--ink); }

  .modal-body { padding: 24px 28px; }

  .form-group { margin-bottom: 18px; }

  .form-label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--gold);
    background: #fff;
  }

  .form-textarea { resize: vertical; min-height: 80px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* INGREDIENTS BUILDER */
  .ing-builder { border: 1px solid var(--rule); background: var(--paper); }

  .ing-builder-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ing-builder-header span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .ing-row {
    display: grid;
    grid-template-columns: 1fr 80px 28px;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    align-items: center;
  }

  .ing-row:last-of-type { border-bottom: none; }

  .ing-input {
    padding: 6px 8px;
    border: 1px solid var(--rule);
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    width: 100%;
  }

  .ing-input:focus { border-color: var(--gold); }

  .ing-remove {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .ing-remove:hover { border-color: var(--danger); color: var(--danger); }

  .ing-add-row {
    padding: 8px 12px;
  }

  .btn-add-ing {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 1px dashed var(--rule);
    background: none;
    color: var(--muted);
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
  }

  .btn-add-ing:hover { border-color: var(--gold); color: var(--gold); }

  .modal-footer {
    padding: 16px 28px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: var(--paper);
    position: sticky;
    bottom: 0;
  }

  /* PRINT */
  @media print {
    header, .tabs, .section-header .btn, .card-actions { display: none !important; }
    body { background: white; }
    main { padding: 20px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .card:hover { transform: none; box-shadow: none; }
  }

  @media (max-width: 600px) {
    header { padding: 20px; }
    main { padding: 20px; }
    .tabs { padding: 0 20px; }
    .grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>The Republic Bar</h1>
    <p>Cocktail Spec Sheets</p>
  </div>
  <div class="header-right">
    <button class="btn" onclick="window.print()">⎙ Print</button>
    <button class="btn btn-primary" onclick="openModal()">+ Add Cocktail</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="setTab('all')" id="tab-all">
    All <span class="tab-count" id="count-all">0</span>
  </button>
  <button class="tab" onclick="setTab('signatures')" id="tab-signatures">
    Signatures <span class="tab-count" id="count-signatures">0</span>
  </button>
  <button class="tab" onclick="setTab('classics')" id="tab-classics">
    Classics <span class="tab-count" id="count-classics">0</span>
  </button>
  <button class="tab" onclick="setTab('na')" id="tab-na">
    Non-Alcoholic <span class="tab-count" id="count-na">0</span>
  </button>
</div>

<main>
  <div class="section-header">
    <div class="section-title" id="section-title">
      All Cocktails <span id="section-subtitle">— Spec Reference</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Cocktail</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cocktail Name *</label>
          <input class="form-input" id="f-name" placeholder="e.g. Orchard Sour" />
        </div>
        <div class="form-group">
          <label class="form-label">Section *</label>
          <select class="form-select" id="f-section">
            <option value="signatures">Signatures</option>
            <option value="classics">Classics</option>
            <option value="na">Non-Alcoholic</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Glass *</label>
          <input class="form-input" id="f-glass" placeholder="e.g. Coupe, Rocks, Highball" />
        </div>
        <div class="form-group">
          <label class="form-label">Garnish</label>
          <input class="form-input" id="f-garnish" placeholder="e.g. Dehydrated lemon wheel" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Ingredients</label>
        <div class="ing-builder">
          <div class="ing-builder-header">
            <span>Ingredient</span>
            <span>mL</span>
          </div>
          <div id="ing-list"></div>
          <div class="ing-add-row">
            <button class="btn-add-ing" onclick="addIngredient()">+ Add Ingredient</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Method</label>
        <textarea class="form-textarea" id="f-method" placeholder="e.g. Dry shake aquafab, add ice, shake hard, double strain into chilled coupe."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCocktail()">Save Spec</button>
    </div>
  </div>
</div>

<script>
  let cocktails = JSON.parse(localStorage.getItem('republic-specs') || '[]');
  let currentTab = 'all';
  let editingId = null;

  function save() {
    localStorage.setItem('republic-specs', JSON.stringify(cocktails));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2);
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    const titles = {
      all: ['All Cocktails', '— Spec Reference'],
      signatures: ['Signature Cocktails', '— Seasonal Menu'],
      classics: ['Classic Cocktails', '— Year Round'],
      na: ['Non-Alcoholic', '— Inclusive Options'],
    };
    document.getElementById('section-title').childNodes[0].textContent = titles[tab][0] + ' ';
    document.getElementById('section-subtitle').textContent = titles[tab][1];

    render();
  }

  function render() {
    const filtered = currentTab === 'all'
      ? cocktails
      : cocktails.filter(c => c.section === currentTab);

    // Update counts
    ['all', 'signatures', 'classics', 'na'].forEach(t => {
      const count = t === 'all' ? cocktails.length : cocktails.filter(c => c.section === t).length;
      document.getElementById('count-' + t).textContent = count;
    });

    const grid = document.getElementById('grid');

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <h3>No specs yet</h3>
          <p>Add your first cocktail to get started</p>
          <button class="btn btn-primary" onclick="openModal()">+ Add Cocktail</button>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(c => cardHTML(c)).join('');
  }

  function sectionClass(section) {
    return { signatures: 'sig', classics: 'classic', na: 'na' }[section] || 'sig';
  }

  function cardHTML(c) {
    const cls = sectionClass(c.section);
    const sectionLabel = { signatures: 'Signature', classics: 'Classic', na: 'Non-Alcoholic' }[c.section];

    const ings = (c.ingredients || []).map(i =>
      `<li><span class="ing-name">${i.name}</span><span class="ing-vol">${i.vol ? i.vol + 'mL' : '—'}</span></li>`
    ).join('');

    return `
    <div class="card ${cls}">
      <div class="card-accent"></div>
      <div class="card-header">
        <div class="card-name">${c.name}</div>
        <div class="card-actions">
          <button class="icon-btn" onclick="editCocktail('${c.id}')" title="Edit">✎</button>
          <button class="icon-btn delete" onclick="deleteCocktail('${c.id}')" title="Delete">✕</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="meta-tag">${sectionLabel}</span>
          ${c.glass ? `<span class="meta-tag glass">⬡ ${c.glass}</span>` : ''}
        </div>
        ${c.ingredients && c.ingredients.length > 0 ? `
          <div class="spec-label">Ingredients</div>
          <ul class="ingredients-list">${ings}</ul>
        ` : ''}
        ${c.method ? `
          <div class="spec-label">Method</div>
          <div class="spec-text">${c.method}</div>
        ` : ''}
      </div>
      ${c.garnish ? `
        <div class="card-footer">
          <div class="footer-garnish"><strong>Garnish</strong>${c.garnish}</div>
        </div>
      ` : ''}
    </div>`;
  }

  // INGREDIENT ROWS
  let ingredientCount = 0;

  function addIngredient(name = '', vol = '') {
    ingredientCount++;
    const id = 'ing-' + ingredientCount;
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.id = id;
    row.innerHTML = `
      <input class="ing-input" placeholder="e.g. Bulleit Bourbon" value="${name}" data-field="name" />
      <input class="ing-input" placeholder="45" value="${vol}" data-field="vol" type="number" min="0" />
      <button class="ing-remove" onclick="removeIngredient('${id}')">✕</button>
    `;
    document.getElementById('ing-list').appendChild(row);
  }

  function removeIngredient(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function getIngredients() {
    return Array.from(document.querySelectorAll('#ing-list .ing-row')).map(row => ({
      name: row.querySelector('[data-field="name"]').value.trim(),
      vol: row.querySelector('[data-field="vol"]').value.trim(),
    })).filter(i => i.name);
  }

  // MODAL
  function openModal(id = null) {
    editingId = id;
    document.getElementById('ing-list').innerHTML = '';
    ingredientCount = 0;

    if (id) {
      const c = cocktails.find(x => x.id === id);
      document.getElementById('modal-title').textContent = 'Edit Cocktail';
      document.getElementById('f-name').value = c.name;
      document.getElementById('f-section').value = c.section;
      document.getElementById('f-glass').value = c.glass || '';
      document.getElementById('f-garnish').value = c.garnish || '';
      document.getElementById('f-method').value = c.method || '';
      (c.ingredients || []).forEach(i => addIngredient(i.name, i.vol));
    } else {
      document.getElementById('modal-title').textContent = 'Add Cocktail';
      document.getElementById('f-name').value = '';
      document.getElementById('f-section').value = 'signatures';
      document.getElementById('f-glass').value = '';
      document.getElementById('f-garnish').value = '';
      document.getElementById('f-method').value = '';
      addIngredient();
    }

    document.getElementById('modal').classList.add('open');
    document.getElementById('f-name').focus();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
  }

  function editCocktail(id) { openModal(id); }

  function saveCocktail() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { alert('Please enter a cocktail name.'); return; }

    const data = {
      name,
      section: document.getElementById('f-section').value,
      glass: document.getElementById('f-glass').value.trim(),
      garnish: document.getElementById('f-garnish').value.trim(),
      method: document.getElementById('f-method').value.trim(),
      ingredients: getIngredients(),
    };

    if (editingId) {
      const idx = cocktails.findIndex(c => c.id === editingId);
      cocktails[idx] = { ...cocktails[idx], ...data };
    } else {
      cocktails.push({ id: generateId(), ...data });
    }

    save();
    closeModal();
    render();
  }

  function deleteCocktail(id) {
    if (!confirm('Remove this spec?')) return;
    cocktails = cocktails.filter(c => c.id !== id);
    save();
    render();
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  render();
</script>
</body>
</html>

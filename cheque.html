<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Cheque Payout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 0.5px solid #e0e0dc;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    .logo {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 1.75rem;
      color: #1a1a1a;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      font-size: 15px;
      border: 0.5px solid #d0d0cc;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus { border-color: #999; }
    input::placeholder { color: #bbb; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .total-card {
      background: #f5f5f3;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin: 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label { font-size: 13px; color: #666; }
    .total-value { font-size: 24px; font-weight: 500; color: #1a1a1a; }

    .btn {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      background: #1a1a1a;
      border: none;
      color: #fff;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: #333; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .preview {
      margin-top: 1.5rem;
      border: 0.5px solid #e0e0dc;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .preview-header {
      background: #f5f5f3;
      padding: 8px 14px;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 0.5px solid #e0e0dc;
    }

    .preview-body {
      padding: 1rem 1.25rem;
      font-size: 13px;
      line-height: 1.75;
      color: #1a1a1a;
      font-family: inherit;
    }

    .note {
      font-size: 12px;
      color: #999;
      margin-top: 1rem;
      text-align: center;
    }

    .note strong { color: #666; font-weight: 500; }

    .checklist {
      display: none;
      border: 0.5px solid #e0e0dc;
      border-radius: 10px;
      overflow: hidden;
      margin: 1.25rem 0;
    }

    .checklist-header {
      background: #f5f5f3;
      padding: 8px 14px;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 0.5px solid #e0e0dc;
    }

    .checklist-body { padding: 0.75rem 1rem; }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 0.5rem 0;
      cursor: pointer;
    }

    .check-item:not(:last-child) {
      border-bottom: 0.5px solid #f0f0ec;
    }

    .check-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-width: 16px;
      margin-top: 2px;
      accent-color: #1a1a1a;
      cursor: pointer;
      padding: 0;
      border: none;
      border-radius: 3px;
    }

    .check-item span {
      font-size: 13px;
      color: #444;
      line-height: 1.45;
      user-select: none;
    }

    .check-item input[type="checkbox"]:checked + span {
      color: #1a1a1a;
    }

    .post-checklist {
      display: none;
      border: 0.5px solid #c8e6c9;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 1.25rem;
    }

    .post-checklist .checklist-header {
      background: #f1f8f1;
      border-bottom-color: #c8e6c9;
      color: #4a7a4a;
    }

    /* Success overlay */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }

    .success-overlay.visible {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-tick {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #2e7d32;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-tick svg {
      width: 52px;
      height: 52px;
      stroke: #fff;
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawTick 0.4s ease 0.25s forwards;
    }

    @keyframes drawTick {
      to { stroke-dashoffset: 0; }
    }

    .success-label {
      font-size: 17px;
      font-weight: 500;
      color: #2e7d32;
      animation: fadeIn 0.3s ease 0.5s both;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      gap: 12px;
    }

    .title-row h1 {
      margin-bottom: 0;
    }

    .jackpot-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 5px 11px 5px 9px;
      border-radius: 20px;
      border: 1px solid #e0e0dc;
      background: #f5f5f3;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .jackpot-toggle input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #c8a000;
      cursor: pointer;
      margin: 0;
    }

    .jackpot-toggle span {
      font-size: 12px;
      font-weight: 500;
      color: #777;
      transition: color 0.2s;
    }

    .jackpot-toggle:has(input:checked) {
      background: #fffbe6;
      border-color: #e8c000;
    }

    .jackpot-toggle:has(input:checked) span {
      color: #7a5f00;
    }

    .card {
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card.jackpot-active {
      border-color: #e8c000;
      box-shadow: 0 0 0 3px rgba(232,192,0,0.18), 0 0 28px 6px rgba(232,192,0,0.13);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">The Republic Hotel</div>
    <div class="title-row">
      <h1>Gaming Cheque Payout</h1>
      <label class="jackpot-toggle">
        <input type="checkbox" id="chk-jackpot" onchange="toggleJackpot()" />
        <span>&#9889; Link Jackpot</span>
      </label>
    </div>

    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" placeholder="e.g. Steven Peter Agosta" oninput="update()" />
    </div>

    <div class="row">
      <div class="field">
        <label>Machine #</label>
        <input type="number" id="machine" placeholder="e.g. 4" oninput="update()" />
      </div>
      <div class="field">
        <label>Cheque number</label>
        <input type="text" id="chequeNum" placeholder="e.g. 500461" oninput="update()" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Cheque payout ($)</label>
        <input type="number" id="chequePayout" placeholder="0.00" step="0.01" oninput="update()" />
      </div>
      <div class="field">
        <label>Cash payout ($)</label>
        <input type="number" id="cashPayout" placeholder="0.00" step="0.01" oninput="update()" />
      </div>
    </div>

    <div class="total-card">
      <span class="total-label">Total payout</span>
      <span class="total-value" id="totalDisplay">$0.00</span>
    </div>

    <div class="checklist" id="checklist">
      <div class="checklist-header">Pre-send confirmation</div>
      <div class="checklist-body">
        <label class="check-item">
          <input type="checkbox" id="chk-id" onchange="updateBtn()" />
          <span id="chk-id-label">Valid ID sighted &amp; all information completed</span>
        </label>
        <label class="check-item">
          <input type="checkbox" id="chk-cheque" onchange="updateBtn()" />
          <span>Cheque details are correct — words &amp; numbers match, cheque is signed &amp; stamped</span>
        </label>
      </div>
    </div>

    <button class="btn" id="sendBtn" onclick="openEmail()" disabled>Open in Outlook ↗</button>

    <div class="preview" id="preview">
      <div class="preview-header">Email preview</div>
      <div class="preview-body" id="previewBody"></div>
    </div>

    <p class="note"><strong>Remember:</strong> attach the cheque payout document before sending.</p>

    <div class="post-checklist checklist" id="post-checklist">
      <div class="checklist-header">After sending</div>
      <div class="checklist-body">
        <label class="check-item">
          <input type="checkbox" id="chk-ccu" onchange="checkComplete()" />
          <span>Entered into CCU</span>
        </label>
        <label class="check-item" id="chk-globaleye-row" style="display:none;">
          <input type="checkbox" id="chk-globaleye" onchange="checkComplete()" />
          <span>Entered into Global Eye</span>
        </label>
        <label class="check-item">
          <input type="checkbox" id="chk-register" onchange="checkComplete()" />
          <span>Gaming Payout Register completed</span>
        </label>
        <label class="check-item">
          <input type="checkbox" id="chk-drive" onchange="checkComplete()" />
          <span>Saved in Venue Drive (V:/Gaming/Payouts) &amp; filed in folder in the office</span>
        </label>
      </div>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-tick">
      <svg viewBox="0 0 52 52">
        <polyline points="10,27 21,38 42,16" />
      </svg>
    </div>
    <div class="success-label">Payout complete</div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────
    const TO = 'Cheque';
    // ────────────────────────────────────────────────────────────────

    function fmt(val) {
      const n = parseFloat(val) || 0;
      return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function today() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${dd}.${mm}.${yy}`;
    }

    function getFields() {
      return {
        name: document.getElementById('name').value.trim(),
        machine: document.getElementById('machine').value.trim(),
        chequeNum: document.getElementById('chequeNum').value.trim(),
        chequePayout: parseFloat(document.getElementById('chequePayout').value) || 0,
        cashPayout: parseFloat(document.getElementById('cashPayout').value) || 0,
      };
    }

    function greeting() {
      const h = new Date().getHours();
      if (h >= 17 && h < 22) return 'Good evening';
      if (h >= 12) return 'Good afternoon';
      return 'Good morning';
    }

    function buildBody(f, total) {
      const sep = '\u2015'.repeat(35);
      const row = (label, value) => `${label}:\t${value}`;
      return `${greeting()} team,

Please find attached a gaming cheque payout from today.

${sep}
${row('Name',           f.name || '[Name]')}
${row('Machine',        '#' + (f.machine || '[Machine]'))}
${row('Cheque Payout',  fmt(f.chequePayout))}
${row('Cash Payout',    fmt(f.cashPayout))}
${row('Cheque Number',  f.chequeNum || '[Cheque Number]')}
${sep}
${row('TOTAL PAYOUT',   fmt(total))}
${sep}

Any questions please reach out.

Thank you & have a great day!`;
    }

    function buildPreviewHTML(f, total) {
      const row = (label, value) =>
        `<div style="display:flex;gap:0;line-height:1.75;"><span style="font-weight:600;min-width:140px;">${label}:</span><span>${value}</span></div>`;
      return [
        'Good evening team,',
        '',
        'Please find attached a gaming cheque payout from today.',
        '',
        'Details below:',
        '',
        row('Name', f.name || '[Name]'),
        row('Machine', '#' + (f.machine || '[Machine]')),
        row('Cheque Payout', fmt(f.chequePayout)),
        row('Cash Payout', fmt(f.cashPayout)),
        row('Total Payout', fmt(total)),
        row('Cheque Number', f.chequeNum || '[Cheque Number]'),
        '',
        'Any questions please reach out.',
        '',
        'Thank you &amp; have a great day!',
      ].join('<br>');
    }

    function toggleJackpot() {
      const checked = document.getElementById('chk-jackpot').checked;
      document.querySelector('.card').classList.toggle('jackpot-active', checked);
    }

    function updateBtn() {
      const chkId = document.getElementById('chk-id').checked;
      const chkCheque = document.getElementById('chk-cheque').checked;
      document.getElementById('sendBtn').disabled = !(chkId && chkCheque);
    }

    function update() {
      const f = getFields();
      const total = f.chequePayout + f.cashPayout;
      document.getElementById('totalDisplay').textContent = fmt(total);

      const idLabel = document.getElementById('chk-id-label');
      if (total >= 10000) {
        idLabel.textContent = '2 Valid IDs sighted & all information on both forms completed';
      } else {
        idLabel.textContent = 'Valid ID sighted & all information completed';
      }

      const hasData = f.name || f.machine || f.chequeNum || f.chequePayout || f.cashPayout;
      if (hasData) {
        document.getElementById('previewBody').innerHTML = buildPreviewHTML(f, total);
        document.getElementById('preview').style.display = 'block';
        document.getElementById('checklist').style.display = 'block';
      } else {
        document.getElementById('preview').style.display = 'none';
        document.getElementById('checklist').style.display = 'none';
        document.getElementById('chk-id').checked = false;
        document.getElementById('chk-cheque').checked = false;
        document.getElementById('sendBtn').disabled = true;
      }
      updateBtn();
    }

    let emailOpened = false;

    function openEmail() {
      const f = getFields();
      const total = f.chequePayout + f.cashPayout;
      const subject = `Republic Gaming Cheque Payout - ${f.name || '[Name]'} ${today()}`;
      const body = buildBody(f, total);
      const mailto = `mailto:${encodeURIComponent(TO)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailto;

      emailOpened = true;
      document.getElementById('sendBtn').textContent = 'Email opened ✓';
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('post-checklist').style.display = 'block';
      const isJackpot = document.getElementById('chk-jackpot').checked;
      document.getElementById('chk-globaleye-row').style.display = isJackpot ? 'flex' : 'none';
    }

    function checkComplete() {
      if (!emailOpened) return;
      const ccu = document.getElementById('chk-ccu').checked;
      const reg = document.getElementById('chk-register').checked;
      const drive = document.getElementById('chk-drive').checked;
      const isJackpot = document.getElementById('chk-jackpot').checked;
      const globalEye = isJackpot ? document.getElementById('chk-globaleye').checked : true;
      if (ccu && reg && drive && globalEye) {
        setTimeout(showSuccess, 300);
      }
    }

    function showSuccess() {
      document.getElementById('successOverlay').classList.add('visible');
      setTimeout(resetAll, 2800);
    }

    function resetAll() {
      // Reset fields
      ['name', 'machine', 'chequeNum', 'chequePayout', 'cashPayout'].forEach(id => {
        document.getElementById(id).value = '';
      });
      // Reset checkboxes
      ['chk-id', 'chk-cheque', 'chk-jackpot', 'chk-ccu', 'chk-globaleye', 'chk-register', 'chk-drive'].forEach(id => {
        document.getElementById(id).checked = false;
      });
      // Reset state
      emailOpened = false;
      document.getElementById('sendBtn').textContent = 'Open in Outlook ↗';
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('checklist').style.display = 'none';
      document.getElementById('post-checklist').style.display = 'none';
      document.getElementById('chk-globaleye-row').style.display = 'none';
      document.getElementById('preview').style.display = 'none';
      document.getElementById('totalDisplay').textContent = '$0.00';
      document.getElementById('successOverlay').classList.remove('visible');
      document.querySelector('.card').classList.remove('jackpot-active');
    }
  </script>
</body>
</html>

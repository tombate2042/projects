<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Cheque Payout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 0.5px solid #e0e0dc;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    .logo {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 1.75rem;
      color: #1a1a1a;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      font-size: 15px;
      border: 0.5px solid #d0d0cc;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus { border-color: #999; }
    input::placeholder { color: #bbb; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .total-card {
      background: #f5f5f3;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin: 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label { font-size: 13px; color: #666; }
    .total-value { font-size: 24px; font-weight: 500; color: #1a1a1a; }

    .btn {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      background: #1a1a1a;
      border: none;
      color: #fff;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: #333; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .preview {
      margin-top: 1.5rem;
      border: 0.5px solid #e0e0dc;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .preview-header {
      background: #f5f5f3;
      padding: 8px 14px;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 0.5px solid #e0e0dc;
    }

    .preview-body {
      padding: 1rem 1.25rem;
      font-size: 13px;
      line-height: 1.75;
      color: #1a1a1a;
      white-space: pre-wrap;
      font-family: inherit;
    }

    .note {
      font-size: 12px;
      color: #999;
      margin-top: 1rem;
      text-align: center;
    }

    .note strong { color: #666; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">The Republic Bar</div>
    <h1>Gaming cheque payout</h1>

    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" placeholder="e.g. William James Redfern" oninput="update()" />
    </div>

    <div class="row">
      <div class="field">
        <label>Machine #</label>
        <input type="number" id="machine" placeholder="e.g. 4" oninput="update()" />
      </div>
      <div class="field">
        <label>Cheque number</label>
        <input type="text" id="chequeNum" placeholder="e.g. 500461" oninput="update()" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Cheque payout ($)</label>
        <input type="number" id="chequePayout" placeholder="0.00" step="0.01" oninput="update()" />
      </div>
      <div class="field">
        <label>Cash payout ($)</label>
        <input type="number" id="cashPayout" placeholder="0.00" step="0.01" oninput="update()" />
      </div>
    </div>

    <div class="total-card">
      <span class="total-label">Total payout</span>
      <span class="total-value" id="totalDisplay">$0.00</span>
    </div>

    <button class="btn" onclick="openEmail()">Open in Outlook ↗</button>

    <div class="preview" id="preview">
      <div class="preview-header">Email preview</div>
      <div class="preview-body" id="previewBody"></div>
    </div>

    <p class="note"><strong>Remember:</strong> attach the cheque payout document before sending.</p>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────
    const TO = [
      'placeholder1@republic.com.au',
      'placeholder2@republic.com.au',
      'placeholder3@republic.com.au'
    ];
    const CC = 'placeholder-cc@republic.com.au';
    // ────────────────────────────────────────────────────────────────

    function fmt(val) {
      const n = parseFloat(val) || 0;
      return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function today() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${dd}.${mm}.${yy}`;
    }

    function getFields() {
      return {
        name: document.getElementById('name').value.trim(),
        machine: document.getElementById('machine').value.trim(),
        chequeNum: document.getElementById('chequeNum').value.trim(),
        chequePayout: parseFloat(document.getElementById('chequePayout').value) || 0,
        cashPayout: parseFloat(document.getElementById('cashPayout').value) || 0,
      };
    }

    function buildBody(f, total) {
      return `Good evening team,

Please find attached a gaming cheque payout from today.

Details below:

Name: ${f.name || '[Name]'}
Machine: #${f.machine || '[Machine]'}
Cheque Payout: ${fmt(f.chequePayout)}
Cash Payout: ${fmt(f.cashPayout)}
Total Payout: ${fmt(total)}
Cheque Number: ${f.chequeNum || '[Cheque Number]'}

Any questions please reach out.

Thank you & have a great day!`;
    }

    function update() {
      const f = getFields();
      const total = f.chequePayout + f.cashPayout;
      document.getElementById('totalDisplay').textContent = fmt(total);

      const hasData = f.name || f.machine || f.chequeNum || f.chequePayout || f.cashPayout;
      if (hasData) {
        document.getElementById('previewBody').textContent = buildBody(f, total);
        document.getElementById('preview').style.display = 'block';
      } else {
        document.getElementById('preview').style.display = 'none';
      }
    }

    function openEmail() {
      const f = getFields();
      const total = f.chequePayout + f.cashPayout;
      const subject = `Republic Gaming Cheque Payout - ${f.name || '[Name]'} ${today()}`;
      const body = buildBody(f, total);
      const mailto = `mailto:${TO.join(',')}?cc=${encodeURIComponent(CC)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailto;
    }
  </script>
</body>
</html>

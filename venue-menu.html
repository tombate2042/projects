<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green:       #1a3a2a;
  --green-mid:   #2d6b48;
  --green-light: #e8f0eb;
  --text:        #1a1916;
  --text2:       #5a5750;
  --text3:       #9a968e;
  --bg:          #faf9f7;
  --surface:     #ffffff;
  --border:      #e4e1d8;
  --radius:      8px;
  --sans:        'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; }

/* ── HERO ── */
.hero {
  background: var(--green);
  color: #fff;
  padding: 80px 24px 56px;
  text-align: center;
}
.hero-name {
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.1;
}
.hero-tagline {
  margin-top: 14px;
  font-size: clamp(12px, 1.8vw, 16px);
  font-weight: 600;
  opacity: 0.6;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}
.hero-address {
  margin-top: 14px;
  font-size: 14px;
  opacity: 0.5;
  font-weight: 400;
}
.hero-links {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.hero-link {
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 99px;
  transition: 0.15s;
}
.hero-link:hover { background: rgba(255,255,255,0.12); color: #fff; }

/* ── NAV ── */
.site-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  scrollbar-width: none;
}
.site-nav::-webkit-scrollbar { display: none; }
.nav-inner {
  display: flex;
  padding: 0 24px;
  max-width: 920px;
  margin: 0 auto;
}
.nav-link {
  padding: 14px 20px;
  color: var(--text2);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.nav-link:hover { color: var(--text); }
.nav-link.active { color: var(--green); border-bottom-color: var(--green-mid); }

/* ── SECTIONS ── */
.section {
  max-width: 920px;
  margin: 0 auto;
  padding: 64px 24px;
}
.section + .section { border-top: 1px solid var(--border); }
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--green-mid);
  margin-bottom: 28px;
}

/* ── ABOUT ── */
.intro-text {
  font-size: 16px;
  color: var(--text2);
  line-height: 1.9;
  max-width: 680px;
}

/* ── SPACES ── */
.spaces-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 28px;
}
.space-tab {
  padding: 10px 20px;
  background: none;
  border: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s, border-color 0.15s;
}
.space-tab:hover { color: var(--text); }
.space-tab.active { color: var(--green); border-bottom-color: var(--green-mid); }
.space-detail { display: none; }
.space-detail.active { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.space-detail-img {
  width: 100%;
  border-radius: var(--radius);
  object-fit: cover;
  aspect-ratio: 4/3;
  background: var(--bg);
  border: 1px solid var(--border);
}
.space-detail-text { display: flex; flex-direction: column; gap: 12px; }
.space-detail-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
.space-detail-floor { font-size: 13px; color: var(--text3); font-weight: 500; }
.space-capacity {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: var(--green-mid);
  background: var(--green-light);
  padding: 3px 10px;
  border-radius: 99px;
  align-self: flex-start;
}
.space-desc {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.7;
}
.space-features {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.space-features li {
  font-size: 12px;
  color: var(--text2);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 9px;
  font-weight: 500;
}
@media (max-width: 640px) {
  .space-detail.active { grid-template-columns: 1fr; }
}

/* ── PACKAGES ── */
.packages-list { display: flex; flex-direction: column; gap: 16px; }
.pkg-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pkg-card-head {
  padding: 20px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.pkg-card-head:hover { background: var(--bg); }
.pkg-name { font-size: 17px; font-weight: 700; color: var(--text); }
.pkg-subdesc {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
  line-height: 1.5;
}
.pkg-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.pkg-price {
  font-size: 19px;
  font-weight: 700;
  color: var(--green);
}
.pkg-chevron {
  color: var(--text3);
  font-size: 11px;
  transition: transform 0.2s;
  line-height: 1;
  margin-top: 3px;
}
.pkg-card.open .pkg-chevron { transform: rotate(180deg); }
.pkg-menu {
  display: none;
  border-top: 1px solid var(--border);
}
.pkg-card.open .pkg-menu { display: block; }

/* ── MENU ITEMS ── */
.menu-subcat { border-bottom: 1px solid var(--border); }
.menu-subcat:last-child { border-bottom: none; }
.menu-subcat-name {
  padding: 10px 24px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green-mid);
  background: var(--green-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.subcat-price-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--green-mid);
  opacity: 0.65;
}
.menu-items { padding: 4px 0; }
.menu-item {
  padding: 10px 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  transition: background 0.1s;
}
.menu-item:hover { background: var(--bg); }
.menu-item-left { flex: 1; min-width: 0; }
.menu-item-name { font-size: 14px; font-weight: 600; color: var(--text); }
.menu-item-desc { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.5; }
.menu-item-price {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 1px;
}

/* ── CONTACT ── */
.contact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 28px;
}
.contact-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 5px;
}
.contact-value {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}
.contact-value a { color: var(--green-mid); text-decoration: none; }
.contact-value a:hover { text-decoration: underline; }

/* ── FOOTER ── */
.site-footer {
  background: var(--green);
  color: rgba(255,255,255,0.4);
  text-align: center;
  padding: 22px 24px 96px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

/* ── DIETARY FILTER BAR ── */
.diet-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(20, 46, 33, 0.93);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 10px 18px;
  border-radius: 99px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  z-index: 300;
  white-space: nowrap;
}
.diet-bar-label {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.5px;
  margin-right: 2px;
}
.diet-bubble {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 13px;
  border-radius: 99px;
  border: 1.5px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.65);
  background: transparent;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  letter-spacing: 0.5px;
  font-family: var(--sans);
}
.diet-bubble:hover { border-color: rgba(255,255,255,0.55); color: #fff; }
.diet-bubble.active { background: #fff; border-color: #fff; color: var(--green); }

/* ── FADING ── */
.menu-item { transition: background 0.1s, opacity 0.25s; }
.menu-item.faded { opacity: 0.12; }

/* ── ERROR / LOADING ── */
.state-placeholder {
  text-align: center;
  padding: 100px 24px;
  color: var(--text3);
  font-size: 15px;
}
.state-placeholder h2 { font-size: 20px; color: var(--text2); margin-bottom: 8px; font-weight: 600; }

@media (max-width: 600px) {
  .hero { padding: 56px 20px 40px; }
  .section { padding: 44px 20px; }
  .pkg-card-head { flex-wrap: wrap; }
  .menu-item { padding: 10px 16px; }
  .menu-subcat-name { padding: 10px 16px; }
}
</style>
</head>
<body>

<div id="root">
  <div class="state-placeholder">Loading…</div>
</div>

<script>
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getPackageSubcats(data, pkgId) {
  const ids = data.bookingOptions?.[pkgId] || [];
  const result = [];
  for (const menu of data.menus || []) {
    for (const sub of menu.subcategories || []) {
      if (ids.includes(sub.id)) result.push(sub);
    }
  }
  return result;
}

function selectSpace(idx) {
  document.querySelectorAll('.space-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.space-detail').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function spaceImgFallback(img, idx) {
  const srcs = JSON.parse(img.dataset.srcs);
  const tried = parseInt(img.dataset.try) + 1;
  if (tried < srcs.length) {
    img.dataset.try = tried;
    img.src = srcs[tried];
  } else {
    img.style.display = 'none';
  }
}

function renderPage(data) {
  const v       = data.venue  || {};
  const contact = v.contact   || {};
  const spaces  = (v.spaces   || []).filter(s => s.name);
  const pkgs    = (v.packages || []).filter(p => p.name);

  document.title = v.name || 'Venue';

  // ── NAV ──────────────────────────────────────────────────────
  const navItems = [];
  if (v.intro)       navItems.push({ href: '#about',    label: 'About'    });
  if (spaces.length) navItems.push({ href: '#spaces',   label: 'Spaces'   });
  if (pkgs.length)   navItems.push({ href: '#packages', label: 'Packages' });
  const hasContact = contact.email || contact.phone || contact.website || contact.address;
  if (hasContact)    navItems.push({ href: '#contact',  label: 'Contact'  });

  // ── HERO ─────────────────────────────────────────────────────
  const heroLinks = [];
  if (contact.phone)   heroLinks.push(`<a class="hero-link" href="tel:${esc(contact.phone)}">${esc(contact.phone)}</a>`);
  if (contact.email)   heroLinks.push(`<a class="hero-link" href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>`);
  if (contact.website) {
    const url = contact.website.startsWith('http') ? contact.website : 'https://' + contact.website;
    heroLinks.push(`<a class="hero-link" href="${esc(url)}" target="_blank" rel="noopener">Website</a>`);
  }

  // ── ABOUT ────────────────────────────────────────────────────
  const aboutHtml = v.intro ? `
    <section class="section" id="about">
      <div class="section-label">About</div>
      <div class="intro-text">${esc(v.intro).replace(/\n/g, '<br>')}</div>
    </section>` : '';

  // ── SPACES ───────────────────────────────────────────────────
  let spacesHtml = '';
  if (spaces.length) {
    const tabs = spaces.map((s, i) =>
      `<button class="space-tab${i === 0 ? ' active' : ''}" onclick="selectSpace(${i})">${esc(s.name)}</button>`
    ).join('');
    const spaceImageMap = {
      "Taylor's Rooftop": "Rooftop"
    };
    const IMG_FOLDER = 'venue-menue_images';
    const IMG_EXTS = ['jpg', 'jpeg', 'png', 'webp'];

    const panels = spaces.map((s, i) => {
      const features = (s.features || '').split('\n').map(f => f.trim()).filter(Boolean);
      const imgName = spaceImageMap[s.name] || s.name;
      const imgSrcset = IMG_EXTS.map(ext => `${IMG_FOLDER}/${imgName}.${ext}`);
      const imgHtml = `<img class="space-detail-img" src="${imgSrcset[0]}" alt="${esc(s.name)}" onerror="spaceImgFallback(this, ${i})" data-try="0" data-srcs='${JSON.stringify(imgSrcset)}'>`;
      return `
        <div class="space-detail${i === 0 ? ' active' : ''}" id="space-panel-${i}">
          ${imgHtml}
          <div class="space-detail-text">
            <div>
              <div class="space-detail-name">${esc(s.name)}</div>
              ${s.floor ? `<div class="space-detail-floor">${esc(s.floor)}</div>` : ''}
            </div>
            ${s.capacity    ? `<span class="space-capacity">${esc(s.capacity)}</span>` : ''}
            ${s.description ? `<div class="space-desc">${esc(s.description)}</div>` : ''}
            ${features.length ? `<ul class="space-features">${features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : ''}
          </div>
        </div>`;
    }).join('');
    spacesHtml = `
      <section class="section" id="spaces">
        <div class="section-label">Spaces</div>
        <div class="spaces-tabs">${tabs}</div>
        ${panels}
      </section>`;
  }

  // ── PACKAGES ─────────────────────────────────────────────────
  let packagesHtml = '';
  if (pkgs.length) {
    const cards = pkgs.map((pkg, i) => {
      const subcats   = getPackageSubcats(data, pkg.id);
      const showPrice = pkg.type === 'alacarte' || pkg.type === 'shared';
      const menuHtml  = subcats.map(sc => {
        const items = (sc.items || []).filter(item => item.name);
        if (!items.length) return '';
        const rows = items.map(item => {
          const dietAttr = (item.dietaries || []).join(' ');
          return `
            <div class="menu-item" data-dietaries="${esc(dietAttr)}">
              <div class="menu-item-left">
                <div class="menu-item-name">${esc(item.name)}</div>
                ${item.description ? `<div class="menu-item-desc">${esc(item.description)}</div>` : ''}
              </div>
              ${showPrice && item.price ? `<div class="menu-item-price">${esc(item.price)}</div>` : ''}
            </div>`;
        }).join('');
        const headerRight = sc.priceNote
          ? `<span class="subcat-price-label">${esc(sc.priceNote)}</span>`
          : (showPrice ? `<span class="subcat-price-label">Price</span>` : '');
        return `
          <div class="menu-subcat">
            <div class="menu-subcat-name">
              <span>${esc(sc.name)}</span>
              ${headerRight}
            </div>
            <div class="menu-items">${rows}</div>
          </div>`;
      }).join('');

      return `
        <div class="pkg-card${i === 0 ? ' open' : ''}" id="pkg-${esc(pkg.id)}">
          <div class="pkg-card-head" onclick="togglePkg('pkg-${esc(pkg.id)}')">
            <div>
              <div class="pkg-name">${esc(pkg.name)}</div>
              ${pkg.description ? `<div class="pkg-subdesc">${esc(pkg.description)}</div>` : ''}
            </div>
            <div class="pkg-right">
              ${pkg.price ? `<div class="pkg-price">${esc(pkg.type !== 'alacarte' && !pkg.price.toLowerCase().includes('pp') ? pkg.price + 'pp' : pkg.price)}</div>` : ''}
              ${menuHtml  ? `<div class="pkg-chevron">▼</div>` : ''}
            </div>
          </div>
          ${menuHtml ? `<div class="pkg-menu">${menuHtml}</div>` : ''}
        </div>`;
    }).join('');

    packagesHtml = `
      <section class="section" id="packages">
        <div class="section-label">Packages &amp; Menus</div>
        <div class="packages-list">${cards}</div>
      </section>`;
  }

  // ── CONTACT ──────────────────────────────────────────────────
  let contactHtml = '';
  if (hasContact) {
    const rows = [];
    if (contact.address) {
      const mapsUrl = 'https://maps.google.com/?q=' + encodeURIComponent(contact.address);
      rows.push({ label: 'Address', html: `<a href="${esc(mapsUrl)}" target="_blank" rel="noopener">${esc(contact.address)}</a>` });
    }
    if (contact.phone)   rows.push({ label: 'Phone',   html: `<a href="tel:${esc(contact.phone)}">${esc(contact.phone)}</a>` });
    if (contact.email)   rows.push({ label: 'Email',   html: `<a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>` });
    if (contact.website) {
      const url = contact.website.startsWith('http') ? contact.website : 'https://' + contact.website;
      rows.push({ label: 'Website', html: `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(contact.website)}</a>` });
    }
    contactHtml = `
      <section class="section" id="contact">
        <div class="section-label">Contact</div>
        <div class="contact-grid">
          ${rows.map(r => `
            <div>
              <div class="contact-label">${r.label}</div>
              <div class="contact-value">${r.html}</div>
            </div>`).join('')}
        </div>
      </section>`;
  }

  // ── ASSEMBLE ─────────────────────────────────────────────────
  document.getElementById('root').innerHTML = `
    <header class="hero">
      <div class="hero-name">${esc(v.name) || 'Venue'}</div>
      ${v.tagline ? `<div class="hero-tagline">${esc(v.tagline)}</div>` : ''}
      ${contact.address ? `<div class="hero-address">${esc(contact.address)}</div>` : ''}
      ${heroLinks.length ? `<div class="hero-links">${heroLinks.join('')}</div>` : ''}
    </header>
    ${navItems.length > 1 ? `
      <nav class="site-nav" id="site-nav">
        <div class="nav-inner">
          ${navItems.map(n => `<a class="nav-link" href="${n.href}">${n.label}</a>`).join('')}
        </div>
      </nav>` : ''}
    ${aboutHtml}
    ${spacesHtml}
    ${packagesHtml}
    ${contactHtml}
    <footer class="site-footer">${esc(v.name) || ''}</footer>
  `;

  // Active nav link on scroll
  const links = document.querySelectorAll('.nav-link');
  if (links.length) {
    links[0].classList.add('active');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          const match = document.querySelector(`.nav-link[href="#${e.target.id}"]`);
          if (match) match.classList.add('active');
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('section[id]').forEach(s => observer.observe(s));
  }
}

function togglePkg(id) {
  document.getElementById(id).classList.toggle('open');
}

const DIET_ORDER    = ['V', 'VG', 'GF', 'DF', 'NF'];
let   activeFilters = new Set();

function buildDietBar(data) {
  const found = new Set();
  for (const pkg of (data.venue?.packages || [])) {
    for (const sc of getPackageSubcats(data, pkg.id)) {
      for (const item of sc.items || []) {
        for (const t of item.dietaries || []) found.add(t);
      }
    }
  }
  const tags = DIET_ORDER.filter(t => found.has(t));
  if (!tags.length) return;

  const bar = document.createElement('div');
  bar.className = 'diet-bar';
  bar.innerHTML = `<span class="diet-bar-label">Filter</span>` +
    tags.map(t => `<button class="diet-bubble" data-tag="${t}" onclick="toggleDietFilter('${t}')">${t}</button>`).join('');
  document.body.appendChild(bar);
}

function toggleDietFilter(tag) {
  activeFilters.has(tag) ? activeFilters.delete(tag) : activeFilters.add(tag);
  document.querySelectorAll('.diet-bubble').forEach(b =>
    b.classList.toggle('active', activeFilters.has(b.dataset.tag))
  );
  document.querySelectorAll('.menu-item').forEach(el => {
    if (!activeFilters.size) { el.classList.remove('faded'); return; }
    const itemTags = (el.dataset.dietaries || '').split(' ').filter(Boolean);
    el.classList.toggle('faded', ![...activeFilters].every(t => itemTags.includes(t)));
  });
}

fetch('./menu-data.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => { renderPage(data); buildDietBar(data); })
  .catch(() => {
    document.getElementById('root').innerHTML = `
      <div class="state-placeholder">

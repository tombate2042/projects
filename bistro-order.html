<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistro Meal Order</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface2: #f3f2ef;
    --border: #e4e2dd;
    --border2: #ccc9c0;
    --text: #1a1a1a;
    --text2: #555;
    --text3: #999;
    --accent: #b07d3a;
    --accent-mid: #c89248;
    --accent-light: rgba(176,125,58,0.08);
    --radius: 6px;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  .page-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px 20px;
  }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); }
  .page-meta { font-size: 13px; color: var(--text3); margin-top: 4px; }
  .page-meta span { margin-right: 20px; }
  .pkg-selector { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .pkg-selector label { font-size: 13px; color: var(--text2); font-weight: 500; }
  .pkg-selector select { border: 1px solid var(--border2); border-radius: var(--radius); padding: 6px 10px; font-family: var(--sans); font-size: 13px; background: var(--surface2); color: var(--text); outline: none; cursor: pointer; }
  .header-actions { display: flex; gap: 10px; margin-top: 16px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text); font-family: var(--sans); font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-mid); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-mid); border-color: var(--accent-mid); color: #fff; }
  .btn-icon { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 4px 6px; line-height: 1; border-radius: 4px; }
  .btn-icon:hover { color: var(--text); background: var(--surface2); }

  .content { max-width: 720px; margin: 32px auto; padding: 0 24px; }

  .guest-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .guest-table th {
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text3); padding: 10px 14px; text-align: left;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .guest-table td { padding: 10px 14px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  .guest-table tr:last-child td { border-bottom: none; }
  .guest-num { color: var(--text3); font-size: 12px; text-align: center; width: 32px; }
  .guest-name-input {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; font-family: var(--sans); font-size: 13px;
    width: 100%; background: var(--bg); color: var(--text); outline: none;
  }
  .guest-name-input:focus { border-color: var(--accent-mid); }
  .meal-dish { font-size: 13px; font-weight: 500; color: var(--text); }
  .meal-addons { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .meal-notes { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 2px; }
  .no-meal { font-size: 13px; color: var(--text3); font-style: italic; }

  .add-guest-row { margin-top: 12px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    width: 480px; max-width: 100%; max-height: 85vh;
    display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
  .modal-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
  }
  .cat-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text2);
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
    margin: 16px 0 8px;
  }
  .cat-title:first-child { margin-top: 0; }
  .item-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .item-btn {
    padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface2); cursor: pointer; font-family: var(--sans);
    font-size: 13px; color: var(--text); transition: all 0.1s;
  }
  .item-btn:hover { border-color: var(--accent-mid); background: var(--accent-light); color: var(--accent); }
  .item-btn.selected { border-color: var(--accent-mid); background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .no-items { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

  @media print {
    body { background: #fff; font-size: 12px; }
    .no-print { display: none !important; }
    .page-header { border-bottom: 2px solid #222; padding: 16px 0 12px; }
    .page-title { font-size: 18px; }
    .content { margin: 16px 0; padding: 0; max-width: 100%; }
    .guest-table { border: 1px solid #ccc; }
    .guest-table th { background: #f0f0f0; color: #333; }
    .guest-table td, .guest-table th { border-color: #ccc; }
    .guest-name-input { border: none; background: transparent; padding: 0; }
  }

  .empty-msg {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 32px; text-align: center; color: var(--text3); font-size: 14px;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title" id="headerTitle">Bistro Meal Order</div>
  <div class="page-meta" id="headerMeta"></div>
  <div id="pkgSelectorRow" class="pkg-selector no-print" style="display:none;">
    <label>Menu:</label>
    <select id="pkgSelect" onchange="selectPackage(this.value)"></select>
  </div>
  <div class="header-actions no-print">
    <button class="btn btn-primary" onclick="downloadOrder()">Download order</button>
    <button class="btn" onclick="window.print()">Print order</button>
    <button class="btn" onclick="addGuest()">+ Add guest</button>
  </div>
</div>

<div class="content">
  <div id="emptyMsg" class="empty-msg" style="display:none;">
    No à la carte menu found. Make sure you have set up an à la carte package in the Function Manager on this device.
  </div>
  <div id="guestSection" style="display:none;">
    <table class="guest-table" id="guestTable">
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th style="width:180px">Guest Name</th>
          <th>Meal Selection</th>
          <th class="no-print" style="width:100px"></th>
          <th class="no-print" style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="guestBody"></tbody>
    </table>
    <div class="add-guest-row no-print">
      <button class="btn" onclick="addGuest()" style="margin-top:10px">+ Add guest</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mealModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Select Meal</span>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
let vmData           = {};
let alacartePackages = [];
let currentPackageId = null;
let subcats          = [];
let guests           = [];
let modal            = { guestIdx: -1, dish: '', addOns: [], notes: '' };

function init() {
  try {
    const saved = localStorage.getItem('vmm_data');
    if (saved) vmData = JSON.parse(saved);
  } catch(e) {}

  alacartePackages = (vmData.venue?.packages || []).filter(p => p.type === 'alacarte' && p.name);

  try {
    const form = JSON.parse(localStorage.getItem('rr_form') || '{}');
    if (form.eventName) document.getElementById('headerTitle').textContent = form.eventName + ' — Meal Order';
    const parts = [];
    if (form.date)   parts.push(form.date);
    if (form.client) parts.push(form.client);
    if (form.pax)    parts.push(form.pax + ' guests');
    if (parts.length) document.getElementById('headerMeta').innerHTML = parts.map(p => `<span>${esc(p)}</span>`).join('');
  } catch(e) {}

  if (!alacartePackages.length) {
    document.getElementById('emptyMsg').style.display   = 'block';
    document.getElementById('guestSection').style.display = 'none';
    return;
  }

  if (alacartePackages.length > 1) {
    const sel = document.getElementById('pkgSelect');
    sel.innerHTML = alacartePackages.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    document.getElementById('pkgSelectorRow').style.display = 'flex';
  }

  document.getElementById('guestSection').style.display = 'block';
  selectPackage(alacartePackages[0].id);

  if (!guests.length) addGuest();
}

function selectPackage(pkgId) {
  currentPackageId = pkgId;
  const subcatIds  = (vmData.bookingOptions || {})[pkgId] || [];
  subcats = [];
  (vmData.menus || []).forEach(menu =>
    (menu.subcategories || []).forEach(sub => {
      if (subcatIds.includes(sub.id)) subcats.push({ ...sub, menuName: menu.name });
    })
  );
  subcats.sort((a, b) => subcatIds.indexOf(a.id) - subcatIds.indexOf(b.id));
  renderGuests();
}

function getItem(name) {
  for (const sub of subcats) {
    const item = (sub.items || []).find(i => i.name === name);
    if (item) return item;
  }
  return null;
}

function addGuest() {
  guests.push({ name: '', dish: '', addOns: [], notes: '' });
  renderGuests();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.guest-name-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 50);
}

function removeGuest(idx) {
  guests.splice(idx, 1);
  renderGuests();
}

function renderGuests() {
  const tbody = document.getElementById('guestBody');
  if (!tbody) return;
  tbody.innerHTML = guests.map((g, i) => {
    const addOnText = (g.addOns || []).map(a =>
      a.startsWith('_addon:') ? a.replace(/^_addon:/, '').replace(/\s*\([^)]+\)\s*$/, '').trim() : a.split(':').pop()
    ).join(' · ');
    const mealHtml = g.dish
      ? `<div class="meal-dish">${esc(g.dish)}</div>
         ${addOnText ? `<div class="meal-addons">${esc(addOnText)}</div>` : ''}
         ${g.notes   ? `<div class="meal-notes">${esc(g.notes)}</div>` : ''}`
      : `<span class="no-meal">No meal selected</span>`;
    return `<tr>
      <td class="guest-num">${i + 1}</td>
      <td><input class="guest-name-input" type="text" value="${esc(g.name)}" placeholder="Guest name" oninput="guests[${i}].name=this.value"></td>
      <td>${mealHtml}</td>
      <td class="no-print"><button class="btn" style="font-size:12px;padding:5px 12px" onclick="openModal(${i})">${g.dish ? 'Edit' : 'Select meal'}</button></td>
      <td class="no-print"><button class="btn-icon" onclick="removeGuest(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

function openModal(idx) {
  modal = { guestIdx: idx, dish: guests[idx]?.dish || '', addOns: [...(guests[idx]?.addOns || [])], notes: guests[idx]?.notes || '' };
  document.getElementById('mealModal').classList.add('open');
  showStep1();
}

function closeModal() {
  document.getElementById('mealModal').classList.remove('open');
}

function showStep1() {
  const name = guests[modal.guestIdx]?.name || `Guest ${modal.guestIdx + 1}`;
  document.getElementById('modalTitle').textContent = `Select Meal — ${name}`;
  let html = '';
  subcats.forEach(sub => {
    const items = (sub.items || []).filter(i => i.name);
    if (!items.length) return;
    html += `<div class="cat-title">${esc(sub.name)}</div><div class="item-grid">`;
    items.forEach(item => {
      html += `<button class="item-btn${item.name === modal.dish ? ' selected' : ''}" onclick="pickDish('${escJs(item.name)}')">${esc(item.name)}</button>`;
    });
    html += `</div>`;
  });
  document.getElementById('modalBody').innerHTML = html || '<p class="no-items">No items found — assign subcategories to this package in the Booking Options tab.</p>';
  document.getElementById('modalFooter').innerHTML = `<button class="btn" onclick="closeModal()">Cancel</button>`;
}

function pickDish(name) {
  modal.dish   = name;
  modal.addOns = [];
  showStep2();
}

function showStep2() {
  document.getElementById('modalTitle').textContent = modal.dish;
  const item   = getItem(modal.dish);
  const groups = (item?.modifiers || []).filter(m => (!m.type || m.type === 'group') && m.group && m.options);
  const addOns = (item?.modifiers || []).filter(m => m.type === 'item' && m.name);

  let html = '';
  groups.forEach(mod => {
    const opts = mod.options.split(',').map(s => s.trim()).filter(Boolean);
    html += `<div class="cat-title">${esc(mod.group)}</div><div class="item-grid">`;
    opts.forEach(opt => {
      const key = mod.group + ':' + opt;
      html += `<button class="item-btn${modal.addOns.includes(key) ? ' selected' : ''}" onclick="toggleAddon('${escJs(key)}')">${esc(opt)}</button>`;
    });
    html += `</div>`;
  });

  if (addOns.length) {
    html += `<div class="cat-title">Add Ons</div><div class="item-grid">`;
    addOns.forEach(addon => {
      const key = '_addon:' + addon.name + (addon.price ? ' (' + addon.price + ')' : '');
      html += `<button class="item-btn${modal.addOns.includes(key) ? ' selected' : ''}" onclick="toggleAddon('${escJs(key)}')">${esc(addon.name)}${addon.price ? `<span style="font-size:11px;opacity:0.65;margin-left:5px;">${esc(addon.price)}</span>` : ''}</button>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <div class="cat-title" style="margin-top:0">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3)">optional</span></div>
    <textarea id="modalNotes" rows="2" style="width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);resize:vertical;outline:none"
      placeholder="Dietary requirements, allergies…" oninput="modal.notes=this.value"></textarea>
  </div>`;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalFooter').innerHTML =
    `<button class="btn" onclick="showStep1()">← Back</button>
     <button class="btn btn-primary" onclick="saveMeal()">Save</button>`;

  const ta = document.getElementById('modalNotes');
  if (ta) ta.value = modal.notes;
}

function toggleAddon(key) {
  const idx = modal.addOns.indexOf(key);
  if (idx > -1) modal.addOns.splice(idx, 1);
  else          modal.addOns.push(key);
  showStep2();
}

function saveMeal() {
  const idx = modal.guestIdx;
  if (idx < 0 || !guests[idx]) return;
  guests[idx].dish   = modal.dish;
  guests[idx].addOns = [...modal.addOns];
  guests[idx].notes  = modal.notes;
  closeModal();
  renderGuests();
}

function downloadOrder() {
  const pkg  = alacartePackages.find(p => p.id === currentPackageId);
  let form   = {};
  try { form = JSON.parse(localStorage.getItem('rr_form') || '{}'); } catch(e) {}

  const payload = {
    version:     1,
    packageId:   currentPackageId,
    packageName: pkg?.name || '',
    eventName:   form.eventName || '',
    exportedAt:  new Date().toISOString(),
    guests
  };

  const filename = (form.eventName || 'order').replace(/[^a-z0-9]/gi, '-').toLowerCase() + '-meal-order.json';
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(str) {
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

init();
</script>
</body>
</html>

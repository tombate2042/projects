<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistro Meal Order</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface2: #f3f2ef;
    --border: #e4e2dd;
    --border2: #ccc9c0;
    --text: #1a1a1a;
    --text2: #555;
    --text3: #999;
    --accent: #b07d3a;
    --accent-mid: #c89248;
    --accent-light: rgba(176,125,58,0.08);
    --radius: 6px;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  /* ── PAGE HEADER ── */
  .page-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px 20px;
  }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); }
  .page-meta { font-size: 13px; color: var(--text3); margin-top: 4px; }
  .page-meta span { margin-right: 20px; }
  .header-actions { display: flex; gap: 10px; margin-top: 16px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text); font-family: var(--sans); font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-mid); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-mid); border-color: var(--accent-mid); color: #fff; }
  .btn-icon { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 4px 6px; line-height: 1; border-radius: 4px; }
  .btn-icon:hover { color: var(--text); background: var(--surface2); }

  /* ── CONTENT ── */
  .content { max-width: 720px; margin: 32px auto; padding: 0 24px; }

  .section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text3); margin-bottom: 12px;
  }

  /* ── GUEST TABLE ── */
  .guest-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .guest-table th {
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text3); padding: 10px 14px; text-align: left;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .guest-table td { padding: 10px 14px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  .guest-table tr:last-child td { border-bottom: none; }
  .guest-num { color: var(--text3); font-size: 12px; text-align: center; width: 32px; }
  .guest-name-input {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; font-family: var(--sans); font-size: 13px;
    width: 100%; background: var(--bg); color: var(--text); outline: none;
  }
  .guest-name-input:focus { border-color: var(--accent-mid); }
  .meal-dish { font-size: 13px; font-weight: 500; color: var(--text); }
  .meal-addons { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .meal-notes { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 2px; }
  .no-meal { font-size: 13px; color: var(--text3); font-style: italic; }

  .add-guest-row { margin-top: 12px; }

  /* ── MEAL MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    width: 480px; max-width: 100%; max-height: 85vh;
    display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
  .modal-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
  }
  .cat-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text2);
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
    margin: 16px 0 8px;
  }
  .cat-title:first-child { margin-top: 0; }
  .item-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .item-btn {
    padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface2); cursor: pointer; font-family: var(--sans);
    font-size: 13px; color: var(--text); transition: all 0.1s;
  }
  .item-btn:hover { border-color: var(--accent-mid); background: var(--accent-light); color: var(--accent); }
  .item-btn.selected { border-color: var(--accent-mid); background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .no-items { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

  /* ── PRINT ── */
  @media print {
    body { background: #fff; font-size: 12px; }
    .no-print { display: none !important; }
    .page-header { border-bottom: 2px solid #222; padding: 16px 0 12px; }
    .page-title { font-size: 18px; }
    .content { margin: 16px 0; padding: 0; max-width: 100%; }
    .guest-table { border: 1px solid #ccc; }
    .guest-table th { background: #f0f0f0; color: #333; }
    .guest-table td, .guest-table th { border-color: #ccc; }
    .guest-name-input { border: none; background: transparent; padding: 0; }
    .btn-icon, .btn { display: none !important; }
    .meal-col-actions { display: none !important; }
    .print-only { display: block !important; }
  }
  .print-only { display: none; }

  /* ── EMPTY STATE ── */
  .empty-menu {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 32px; text-align: center; color: var(--text3); font-size: 14px;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title" id="headerTitle">Bistro Meal Order</div>
  <div class="page-meta" id="headerMeta"></div>
  <div class="header-actions no-print">
    <button class="btn btn-primary" onclick="window.print()">Print order</button>
    <button class="btn" onclick="addGuest()">+ Add guest</button>
  </div>
</div>

<div class="content">
  <div id="noMenuMsg" class="empty-menu" style="display:none">
    No bistro menu found. Make sure you have set up a Bistro menu in the Runsheet app on this device.
  </div>

  <div id="guestSection">
    <table class="guest-table" id="guestTable">
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th style="width:180px">Guest Name</th>
          <th>Meal Selection</th>
          <th class="no-print" style="width:100px"></th>
          <th class="no-print" style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="guestBody"></tbody>
    </table>
    <div class="add-guest-row no-print">
      <button class="btn" onclick="addGuest()" style="margin-top:10px">+ Add guest</button>
    </div>
  </div>
</div>

<!-- Meal Selection Modal -->
<div class="modal-overlay" id="mealModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Select Meal</span>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────

const DISH_CATS = [
  { label: 'Snacks & Sharing', key: 'bistroSnacks' },
  { label: 'Burgers',          key: 'bistroBurgers' },
  { label: 'Pub Classics',     key: 'bistroPubClassics' },
  { label: 'Bowls',            key: 'bistroBowls' },
  { label: 'Mains',            key: 'bistroMains' },
  { label: 'Sides',            key: 'bistroSides' },
];

const ADDONS = [
  { id: 'mainSide',         label: 'Main Side',         key: 'bistroMainSides',        multi: true, max: 2 },
  { id: 'sauce',            label: 'Sauce',             key: 'bistroSauces' },
  { id: 'steakTemp',        label: 'Steak Temp',        key: 'bistroSteakTemp' },
  { id: 'bowlAddOn',        label: 'Bowl Add-On',       key: 'bistroBowlAddOns' },
  { id: 'burgerAddOn',      label: 'Burger Add-On',     key: 'bistroBurgerAddOns' },
  { id: 'schnitzelUpgrade', label: 'Schnitzel Upgrade', key: 'bistroSchnitzelUpgrade' },
  { id: 'extraSauce',       label: 'Extra Sauce',       key: 'bistroExtraSauce' },
];

let menuData = {};
let guests   = [];
let modal    = { guestIdx: -1, dish: '', addOns: {}, notes: '' };

// ── Init ─────────────────────────────────────────────────────────────────────

function init() {
  // Load menu from runsheet localStorage
  try {
    const saved = localStorage.getItem('rr_menus');
    if (saved) menuData = JSON.parse(saved);
  } catch(e) {}

  // Load event info for header
  try {
    const form = JSON.parse(localStorage.getItem('rr_form') || '{}');
    if (form.eventName) {
      document.getElementById('headerTitle').textContent = form.eventName + ' — Meal Order';
    }
    const parts = [];
    if (form.date)   parts.push(form.date);
    if (form.client) parts.push(form.client);
    if (form.pax)    parts.push(form.pax + ' guests');
    if (parts.length) document.getElementById('headerMeta').innerHTML =
      parts.map(p => `<span>${esc(p)}</span>`).join('');
  } catch(e) {}

  // Check we actually have bistro menu items
  const hasItems = DISH_CATS.some(c => (menuData[c.key] || []).length > 0);
  document.getElementById('noMenuMsg').style.display = hasItems ? 'none' : 'block';
  document.getElementById('guestSection').style.display = hasItems ? 'block' : 'none';

  if (hasItems && guests.length === 0) addGuest();
  renderGuests();
}

// ── Guests ───────────────────────────────────────────────────────────────────

function addGuest() {
  guests.push({ name: '', dish: '', addOns: {}, notes: '' });
  renderGuests();
  // Focus the new name input
  setTimeout(() => {
    const inputs = document.querySelectorAll('.guest-name-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 50);
}

function removeGuest(idx) {
  guests.splice(idx, 1);
  renderGuests();
}

function renderGuests() {
  const tbody = document.getElementById('guestBody');
  tbody.innerHTML = guests.map((g, i) => {
    const addonText = Object.entries(g.addOns || {})
      .filter(([, v]) => Array.isArray(v) ? v.length : v)
      .map(([, v]) => Array.isArray(v) ? v.map(esc).join(' & ') : esc(v))
      .join(' · ');
    const mealHtml = g.dish
      ? `<div class="meal-dish">${esc(g.dish)}</div>
         ${addonText ? `<div class="meal-addons">${addonText}</div>` : ''}
         ${g.notes   ? `<div class="meal-notes">${esc(g.notes)}</div>` : ''}`
      : `<span class="no-meal">No meal selected</span>`;
    return `<tr>
      <td class="guest-num">${i + 1}</td>
      <td><input class="guest-name-input" type="text" value="${esc(g.name)}" placeholder="Guest name"
          oninput="guests[${i}].name=this.value"></td>
      <td>${mealHtml}</td>
      <td class="no-print"><button class="btn" style="font-size:12px;padding:5px 12px" onclick="openModal(${i})">${g.dish ? 'Edit' : 'Select meal'}</button></td>
      <td class="no-print"><button class="btn-icon" onclick="removeGuest(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

// ── Modal ────────────────────────────────────────────────────────────────────

function openModal(idx) {
  modal.guestIdx = idx;
  modal.dish   = guests[idx]?.dish  || '';
  modal.addOns = { ...(guests[idx]?.addOns || {}) };
  modal.notes  = guests[idx]?.notes || '';
  document.getElementById('mealModal').classList.add('open');
  showStep1();
}

function closeModal() {
  document.getElementById('mealModal').classList.remove('open');
}

function showStep1() {
  const name = guests[modal.guestIdx]?.name || `Guest ${modal.guestIdx + 1}`;
  document.getElementById('modalTitle').textContent = `Select Meal — ${name}`;

  let html = '';
  DISH_CATS.forEach(({ label, key }) => {
    const items = (menuData[key] || []).map(i => typeof i === 'object' ? i.name : i).filter(Boolean);
    if (!items.length) return;
    html += `<div class="cat-title">${esc(label)}</div><div class="item-grid">`;
    items.forEach(name => {
      const sel = name === modal.dish ? ' selected' : '';
      html += `<button class="item-btn${sel}" onclick="pickDish('${escJs(name)}')">${esc(name)}</button>`;
    });
    html += `</div>`;
  });

  document.getElementById('modalBody').innerHTML = html || '<p class="no-items">No bistro items found in the menu.</p>';
  document.getElementById('modalFooter').innerHTML = `<button class="btn" onclick="closeModal()">Cancel</button>`;
}

function pickDish(dishName) {
  modal.dish   = dishName;
  modal.addOns = {};
  showStep2();
}

function showStep2() {
  document.getElementById('modalTitle').textContent = modal.dish;

  const enabledAddons = (menuData.bistroItemAddons || {})[modal.dish] || [];
  const relevant = ADDONS.filter(a => enabledAddons.includes(a.id));

  let html = '';
  relevant.forEach(a => {
    const options = (menuData[a.key] || []).map(d => typeof d === 'object' ? d.name : d).filter(Boolean);
    if (!options.length) return;
    if (a.multi) {
      const current = Array.isArray(modal.addOns[a.id]) ? modal.addOns[a.id] : [];
      const atMax   = current.length >= a.max;
      html += `<div class="cat-title">${esc(a.label)} <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3)">${current.length}/${a.max}</span></div><div class="item-grid">`;
      options.forEach(n => {
        const sel = current.includes(n);
        const dim = !sel && atMax ? 'opacity:0.35;cursor:default;' : '';
        html += `<button class="item-btn${sel ? ' selected' : ''}" style="${dim}" onclick="pickAddon('${escJs(a.id)}','${escJs(n)}')">${esc(n)}</button>`;
      });
    } else {
      html += `<div class="cat-title">${esc(a.label)}</div><div class="item-grid">`;
      options.forEach(n => {
        const sel = modal.addOns[a.id] === n ? ' selected' : '';
        html += `<button class="item-btn${sel}" onclick="pickAddon('${escJs(a.id)}','${escJs(n)}')">${esc(n)}</button>`;
      });
    }
    html += `</div>`;
  });

  html += `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <div class="cat-title" style="margin-top:0">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3)">optional</span></div>
    <textarea rows="2" style="width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);resize:vertical;outline:none"
      placeholder="Dietary requirements, allergies…"
      oninput="modal.notes=this.value">${esc(modal.notes)}</textarea>
  </div>`;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalFooter').innerHTML =
    `<button class="btn" onclick="showStep1()">← Back</button>
     <button class="btn btn-primary" onclick="saveMeal()">Save</button>`;
}

function pickAddon(addonId, value) {
  const addon = ADDONS.find(a => a.id === addonId);
  if (addon?.multi) {
    const current = Array.isArray(modal.addOns[addonId]) ? [...modal.addOns[addonId]] : [];
    const idx = current.indexOf(value);
    if (idx > -1) current.splice(idx, 1);
    else if (current.length < addon.max) current.push(value);
    modal.addOns[addonId] = current;
  } else {
    modal.addOns[addonId] = modal.addOns[addonId] === value ? '' : value;
  }
  showStep2();
}

function saveMeal() {
  const idx = modal.guestIdx;
  if (idx < 0 || !guests[idx]) return;
  guests[idx].dish   = modal.dish;
  guests[idx].addOns = { ...modal.addOns };
  guests[idx].notes  = modal.notes;
  closeModal();
  renderGuests();
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(str) {
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
